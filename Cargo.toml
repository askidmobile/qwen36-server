[package]
name = "qwen36-server"
version = "0.1.0"
edition = "2021"
description = "Yttri Forge — сервер локального инференса GGUF (Qwen 3.5/3.6/3.8, Ornith)"
license = "MIT OR Apache-2.0"

# Имя исполняемого файла: yforge(.exe). Крейт остаётся qwen36-server, чтобы не
# ломать `use qwen36_server::...` в тестах и внешних потребителях библиотеки.
[[bin]]
name = "yforge"
path = "src/main.rs"

[dependencies]
# Форк лежит соседней директорией (macOS/Windows/Linux одинаково):
# <parent>/Qwen3.6 27B + <parent>/yttri-forge
# Движок берём ТОЛЬКО из yttri-forge: candle-fork — устаревшая копия,
# её HEAD (05aa926a) лежит в истории yttri-forge, уникального в ней нет.
# Сборка против candle-fork давала продакшену код без сегодняшних правок MTP.
qwen35-batch = { path = "../yttri-forge/engine/qwen35-batch", features = ["real-model"] }
candle-transformers = { path = "../yttri-forge/engine/candle-transformers" }
rayon = "1.10"
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: ключи JSON сохраняют порядок клиента. Без него BTreeMap
# сортирует их по алфавиту, и блок <tools> уезжает в
# {"function":{"description":...,"name":...}} вместо обученного
# {"type":"function","function":{"name":...,"description":...}}.
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

# Прямые зависимости от candle-форка: для типов Device/Tokenizer в engine.
candle-core = { path = "../yttri-forge/engine/candle-core" }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
memmap2 = "0.9.3"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# preserve_order и здесь: minijinja держит свой map, и без флага он
# пересортирует ключи ещё до нашего фильтра tojson.
minijinja = { version = "2", features = ["json", "adjacent_loop_items", "builtins", "preserve_order"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
moxcms = "0.8"

candle-flash-attn = { path = "../yttri-forge/engine/candle-flash-attn", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Пауза времени в тестах сайдкара (признак жизни раз в 2 с без реального ожидания).
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"

[features]
# Backend: metal на macOS (разработка), cuda на Windows (yttri-win), иначе CPU.
default = []
metal = ["qwen35-batch/metal", "candle-core/metal", "candle-transformers/metal"]
cuda = ["qwen35-batch/cuda", "candle-core/cuda", "candle-transformers/cuda", "dep:candle-flash-attn"]

# Пробники CUDA-ядер: собираются только с фичей cuda (на macOS/CPU их нет).
[[bin]]
name = "fa_probe"
path = "src/bin/fa_probe.rs"
required-features = ["cuda"]

[[bin]]
name = "mmq_probe"
path = "src/bin/mmq_probe.rs"
required-features = ["cuda"]

[[bin]]
name = "h2d_probe"
path = "src/bin/h2d_probe.rs"
required-features = ["cuda"]

[[bin]]
name = "mmq_ab_probe"
path = "src/bin/mmq_ab_probe.rs"
required-features = ["cuda"]
