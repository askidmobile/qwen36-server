[package]
name = "qwen36-server"
version = "0.1.0"
edition = "2021"
description = "Qwen3.6-27B GGUF inference server на candle-fork-qwen35-batch (BD-002)"

[dependencies]
qwen35-batch = { path = "/Volumes/Askid Dev/Projects/candle-fork-qwen35-batch/qwen35-batch", features = ["real-model"] }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }

# Прямые зависимости от candle-форка НЕ нужны: candle_core/tokenizers
# ре-экспортируются через qwen35-batch (см. lib ре-экспорты ниже не требуются —
# qwen35-batch сам тащит candle-core и tokenizers как transitive deps;
# для типов Device/Tokenizer объявляем их явно с теми же версиями).
candle-core = { path = "/Volumes/Askid Dev/Projects/candle-fork-qwen35-batch/candle-core" }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
memmap2 = "0.9.3"

[features]
# Backend: metal на macOS (разработка), cuda на Windows (yttri-win), иначе CPU.
default = []
metal = ["qwen35-batch/metal", "candle-core/metal"]
cuda = ["qwen35-batch/cuda", "candle-core/cuda"]
