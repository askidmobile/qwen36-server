[package]
name = "qwen36-server"
version = "0.1.0"
edition = "2021"
description = "Qwen3.6-27B GGUF inference server on candle-fork (OpenAI/Anthropic APIs, 4-slot batching)"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

