[package]
name = "qwen36-server"
version = "0.1.0"
edition = "2021"
description = "Qwen3.6-27B GGUF inference server на candle-fork (BD-002)"

[dependencies]
# Форк лежит соседней директорией (macOS/Windows/Linux одинаково):
# <parent>/Qwen3.6 27B + <parent>/candle-fork
qwen35-batch = { path = "../candle-fork/qwen35-batch", features = ["real-model"] }
candle-transformers = { path = "../candle-fork/candle-transformers" }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

# Прямые зависимости от candle-форка: для типов Device/Tokenizer в engine.
candle-core = { path = "../candle-fork/candle-core" }
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
memmap2 = "0.9.3"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
minijinja = { version = "2", features = ["json", "adjacent_loop_items", "builtins"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
moxcms = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
# Backend: metal на macOS (разработка), cuda на Windows (yttri-win), иначе CPU.
default = []
metal = ["qwen35-batch/metal", "candle-core/metal", "candle-transformers/metal"]
cuda = ["qwen35-batch/cuda", "candle-core/cuda", "candle-transformers/cuda"]
