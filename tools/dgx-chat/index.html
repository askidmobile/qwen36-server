<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek V4.1 Flash UNCENSORED VQ — DGX Spark</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1b2128; --line:#252d36;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4c9aff; --user:#1e2a3a;
    --ok:#3fb950; --err:#f85149;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; height:100vh;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto;
  }
  header h1{font-size:14px; font-weight:600; margin:0; letter-spacing:.2px}
  header .meta{font-size:12px; color:var(--muted)}
  .stat{margin-left:auto; display:flex; gap:14px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .stat b{color:var(--text); font-weight:600}
  #dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  #dot.on{background:var(--ok)} #dot.off{background:var(--err)}
  main{flex:1 1 auto; overflow-y:auto; padding:18px 0}
  .wrap{max-width:820px; margin:0 auto; padding:0 16px}
  .msg{margin:0 0 16px; display:flex; gap:10px}
  .who{flex:0 0 30px; height:30px; border-radius:7px; display:grid; place-items:center;
       font-size:11px; font-weight:700; background:var(--panel2); color:var(--muted)}
  .msg.user .who{background:var(--user); color:#9fc4f5}
  .bubble{flex:1 1 auto; min-width:0}
  .bubble .txt{white-space:pre-wrap; word-break:break-word}
  .bubble .txt p{margin:0 0 8px}
  .bubble .txt code{background:#0f1318; padding:1px 5px; border-radius:4px; font-size:13px}
  .bubble .txt pre{background:#0f1318; padding:10px 12px; border-radius:8px; overflow-x:auto; margin:8px 0}
  .bubble .txt pre code{padding:0; background:none}
  .reasoning{border-left:2px solid var(--line); padding-left:10px; color:var(--muted);
             font-size:13px; margin-bottom:8px; white-space:pre-wrap}
  .empty{color:var(--muted); text-align:center; padding:60px 20px}
  .empty h2{font-size:16px; color:var(--text); margin:0 0 8px}
  .empty code{background:var(--panel2); padding:2px 6px; border-radius:4px}
  footer{flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel); padding:12px 0}
  .bar{max-width:820px; margin:0 auto; padding:0 16px; display:flex; gap:10px; align-items:flex-end}
  textarea{
    flex:1 1 auto; resize:none; min-height:46px; max-height:200px; padding:12px 14px;
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; font:inherit; outline:none;
  }
  textarea:focus{border-color:var(--accent)}
  button{
    height:46px; padding:0 18px; border:0; border-radius:10px; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:600; font:inherit;
  }
  button:disabled{opacity:.45; cursor:default}
  button.ghost{background:var(--panel2); color:var(--muted); font-weight:500; padding:0 12px}
  .opts{max-width:820px; margin:8px auto 0; padding:0 16px; display:flex; gap:16px;
        font-size:12px; color:var(--muted); flex-wrap:wrap; align-items:center}
  .opts label{display:flex; gap:6px; align-items:center}
  .opts input[type=number]{width:66px; background:var(--panel2); color:var(--text);
        border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit; font-size:12px}
  .opts input[type=text]{flex:1 1 220px; background:var(--panel2); color:var(--text);
        border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit; font-size:12px}
  .errbox{max-width:820px; margin:0 auto 10px; padding:8px 12px; border-radius:8px;
          background:#2d1618; border:1px solid #5d2226; color:#ffb4ab; font-size:13px}
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <div>
    <h1>DeepSeek V4.1 Flash — UNCENSORED VQ</h1>
    <div class="meta">DGX Spark GB10 · quench off · MTP on</div>
  </div>
  <div class="stat">
    <span>prefill <b id="sPre">—</b></span>
    <span>decode <b id="sDec">—</b></span>
    <span>tokens <b id="sTok">—</b></span>
  </div>
</header>

<main id="scroller"><div class="wrap" id="thread">
  <div class="empty" id="empty">
    <h2>Готово к запросу</h2>
    <div>Модель локальная, на GB10. Всё, что вы напишете, никуда не уходит.</div>
  </div>
</div></main>

<footer>
  <div id="err" class="errbox" style="display:none"></div>
  <div class="bar">
    <textarea id="input" placeholder="Спросите что-нибудь…  (Enter — отправить, Shift+Enter — новая строка)" rows="1"></textarea>
    <button id="send">Отправить</button>
    <button id="stop" class="ghost" disabled>Стоп</button>
  </div>
  <div class="opts">
    <label>URL <input type="text" id="baseUrl" value="http://127.0.0.1:8000"></label>
    <label>max_tokens <input type="number" id="maxTok" value="512" min="1" max="8192"></label>
    <button class="ghost" id="clear" style="height:26px">Очистить</button>
    <span id="hint"></span>
  </div>
</footer>

<script>
(function(){
  var scroller = document.getElementById('scroller');
  var thread   = document.getElementById('thread');
  var empty    = document.getElementById('empty');
  var input    = document.getElementById('input');
  var sendBtn  = document.getElementById('send');
  var stopBtn  = document.getElementById('stop');
  var errBox   = document.getElementById('err');
  var dot      = document.getElementById('dot');
  var sPre     = document.getElementById('sPre');
  var sDec     = document.getElementById('sDec');
  var sTok     = document.getElementById('sTok');
  var baseUrlEl= document.getElementById('baseUrl');
  var maxTokEl = document.getElementById('maxTok');
  var hint     = document.getElementById('hint');

  var history = [];        // {role, content}
  var ctrl = null;
  var busy = false;

  function showErr(m){ errBox.textContent = m; errBox.style.display = m ? 'block' : 'none'; }
  function atBottom(){ return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; }
  function toBottom(){ scroller.scrollTop = scroller.scrollHeight; }

  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  // Minimal, safe formatting: escape first, then allow **bold**, `code`,
  // ```fences``` and paragraphs. No raw HTML ever reaches the DOM.
  function fmt(root, text){
    var parts = text.split(/```/);
    for (var i=0;i<parts.length;i++){
      var chunk = parts[i];
      if (i % 2 === 1) {                     // fenced block
        var pre = el('pre'); var code = el('code', null, chunk.replace(/^\w*\n/, ''));
        pre.appendChild(code); root.appendChild(pre);
        continue;
      }
      chunk.split(/\n{2,}/).forEach(function(par){
        if (!par.trim()) return;
        var p = el('p');
        par.split(/(`[^`]*`)/).forEach(function(seg){
          if (seg.charAt(0)==='`' && seg.charAt(seg.length-1)==='`' && seg.length>1){
            p.appendChild(el('code', null, seg.slice(1,-1)));
          } else {
            var rest = seg.split(/(\*\*[^*]+\*\*)/);
            rest.forEach(function(s){
              if (s.indexOf('**')===0 && s.slice(-2)==='**' && s.length>4){
                var b = el('b'); b.textContent = s.slice(2,-2); p.appendChild(b);
              } else if (s) p.appendChild(document.createTextNode(s));
            });
          }
        });
        root.appendChild(p);
      });
    }
  }

  function addMsg(role, text){
    if (empty && empty.parentNode) empty.parentNode.removeChild(empty);
    var msg = el('div', 'msg ' + role);
    msg.appendChild(el('div','who', role==='user' ? 'Вы' : 'DS'));
    var bubble = el('div','bubble');
    var txt = el('div','txt');
    if (text) fmt(txt, text);
    bubble.appendChild(txt);
    msg.appendChild(bubble);
    thread.appendChild(msg);
    return {msg:msg, txt:txt, bubble:bubble, raw:''};
  }

  function setBusy(v){
    busy = v;
    sendBtn.disabled = v;
    sendBtn.textContent = v ? '…' : 'Отправить';
    stopBtn.disabled = !v;
    input.disabled = v;
  }

  function setStatus(on){
    dot.className = on ? 'on' : 'off';
    dot.title = on ? 'сервер доступен' : 'сервер недоступен';
  }

  async function ping(){
    try {
      var r = await fetch(baseUrlEl.value.replace(/\/$/,'') + '/v1/models', {cache:'no-store'});
      setStatus(r.ok);
      if (r.ok) {
        var j = await r.json();
        var m = (j.data && j.data[0]) || {};
        hint.textContent = m.id ? ('model: ' + m.id + (m.context_length ? ' · ctx ' + m.context_length.toLocaleString() : '')) : '';
      }
    } catch(e){ setStatus(false); }
  }

  async function send(){
    var text = input.value.trim();
    if (!text || busy) return;
    showErr('');
    input.value = '';
    input.style.height = 'auto';
    history.push({role:'user', content:text});
    addMsg('user', text);
    toBottom();

    var out = addMsg('assistant', '');
    var reasoning = el('div','reasoning');
    setBusy(true);

    var t0 = performance.now();
    var ttft = null, lastT = null, nOut = 0, usage = null;
    ctrl = new AbortController();

    try {
      var body = {
        model: 'deepseek-v4.1-flash-1017-uncensored-vq',
        messages: history,
        temperature: 1.0,
        top_p: 1.0,
        max_tokens: parseInt(maxTokEl.value,10) || 512,
        stream: true,
        stream_options: {include_usage:true},
        reasoning_effort: 'none'
      };
      var resp = await fetch(baseUrlEl.value.replace(/\/$/,'') + '/v1/chat/completions', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body), signal: ctrl.signal
      });
      if (!resp.ok){
        var t = await resp.text();
        throw new Error('HTTP ' + resp.status + ': ' + t.slice(0,400));
      }

      var reader = resp.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      for(;;){
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, {stream:true});
        var lines = buf.split('\n');
        buf = lines.pop();
        for (var li=0; li<lines.length; li++){
          var line = lines[li].trim();
          if (!line || line.indexOf('data:') !== 0) continue;
          var payload = line.slice(5).trim();
          if (payload === '[DONE]') continue;
          var ev;
          try { ev = JSON.parse(payload); } catch(e){ continue; }
          if (ev.usage) usage = ev.usage;
          var ch = ev.choices && ev.choices[0];
          if (!ch) continue;
          var d = ch.delta || {};
          if (d.reasoning_content){
            reasoning.textContent += d.reasoning_content;
            if (!reasoning.parentNode) out.bubble.insertBefore(reasoning, out.txt);
          }
          if (d.content){
            var now = performance.now();
            if (ttft === null) ttft = (now - t0)/1000;
            lastT = (now - t0)/1000;
            nOut++;
            out.raw += d.content;
            var stick = atBottom();
            out.txt.innerHTML = '';
            fmt(out.txt, out.raw);
            if (stick) toBottom();
            if (ttft !== null && lastT > ttft && nOut > 1){
              sDec.textContent = ((nOut-1)/(lastT-ttft)).toFixed(1) + ' t/s';
            }
            if (lastT) sTok.textContent = nOut;
          }
        }
      }

      if (usage){
        var p = usage.prompt_tokens || 0;
        if (ttft) sPre.textContent = (p/ttft).toFixed(0) + ' t/s';
        sTok.textContent = (usage.completion_tokens || nOut) + ' / ' + p + ' in';
      }
      if (out.raw) history.push({role:'assistant', content: out.raw});
    } catch(e){
      if (e.name === 'AbortError'){
        if (out.raw) history.push({role:'assistant', content: out.raw});
      } else {
        showErr(e.message || String(e));
        history.pop();
      }
    } finally {
      setBusy(false);
      ctrl = null;
      input.focus();
      toBottom();
    }
  }

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  }

  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', function(){ if (ctrl) ctrl.abort(); });
  document.getElementById('clear').addEventListener('click', function(){
    history = [];
    thread.innerHTML = '';
    thread.appendChild(empty);
    empty.style.display = 'block';
    sPre.textContent = sDec.textContent = sTok.textContent = '—';
    showErr('');
  });
  baseUrlEl.addEventListener('change', ping);

  ping();
  setInterval(ping, 15000);
  input.focus();
})();
</script>
</body>
</html>
