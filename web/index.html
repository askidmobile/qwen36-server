<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.6 27B — чат</title>
<style>
:root {
  --bg: #0f1115; --bg2: #151821; --bg3: #1c2130; --border: #2a3040;
  --fg: #d7dce6; --dim: #8a93a6; --accent: #4f8cff; --user: #233a5e;
  --red: #e5534b; --green: #57ab5a; --yellow: #d29922;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header .brand { font-weight: 600; }
header .badge { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; font-size: 12px; color: var(--dim); }
header input[type=password] { background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; padding: 4px 8px; width: 220px; }
select, input[type=number] { background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; padding: 3px 6px; }
button { background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.ctxwrap { flex: 1; min-width: 140px; max-width: 260px; }
.ctxbar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.ctxbar > div { height: 100%; background: var(--green); width: 0; transition: width .2s; }
.ctxbar > div.warn { background: var(--red); }
.ctxlabel { font-size: 11px; color: var(--dim); white-space: nowrap; }
main { flex: 1; display: flex; min-height: 0; }
aside { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
aside .head { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); }
#chatlist { flex: 1; overflow-y: auto; }
.chatitem { display: flex; align-items: center; padding: 7px 10px; cursor: pointer; gap: 6px; border-bottom: 1px solid var(--border); }
.chatitem:hover { background: var(--bg3); }
.chatitem.active { background: var(--bg3); border-left: 2px solid var(--accent); }
.chatitem .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.chatitem .del { color: var(--dim); border: none; background: none; padding: 0 4px; }
.chatitem .del:hover { color: var(--red); }
section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#messages { flex: 1; overflow-y: auto; padding: 14px; }
.msg { margin-bottom: 12px; max-width: 900px; }
.msg .role { font-size: 11px; color: var(--dim); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .5px; }
.msg .bubble { padding: 9px 12px; border-radius: 8px; background: var(--bg3); white-space: pre-wrap; word-break: break-word; }
.msg.user .bubble { background: var(--user); }
.msg .meta { font-size: 11px; color: var(--dim); margin-top: 3px; display: flex; gap: 10px; }
.msg .meta .trunc { color: var(--yellow); border: 1px solid var(--yellow); border-radius: 4px; padding: 0 5px; }
details.think { margin-bottom: 6px; border: 1px dashed var(--border); border-radius: 6px; padding: 4px 8px; background: var(--bg2); }
details.think summary { cursor: pointer; color: var(--dim); font-size: 12px; }
details.think .tc { white-space: pre-wrap; word-break: break-word; color: var(--dim); font-size: 13px; margin-top: 4px; }
#composer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); }
#input { flex: 1; resize: none; background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 8px 10px; font: inherit; min-height: 44px; max-height: 200px; }
#sampling { border-top: 1px solid var(--border); background: var(--bg2); }
#sampling summary { padding: 5px 14px; cursor: pointer; color: var(--dim); font-size: 12px; }
#sampling .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; padding: 4px 14px 10px; }
#sampling label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
#sampling input { width: 70px; }
#keyform { margin: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 24px; display: none; flex-direction: column; gap: 10px; width: 340px; }
#keyform h2 { margin: 0; font-size: 16px; }
#keyform input { background: var(--bg3); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; padding: 6px 8px; }
.err { color: var(--red); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="brand" id="brand">Qwen3.6</span>
  <span id="modelinfo" class="badge">…</span>
  <input type="password" id="apikey" placeholder="API key" autocomplete="off">
  <select id="mode" title="Режим / пресет сэмплинга">
    <option value="thinking">thinking</option>
    <option value="thinking-coding">thinking-coding</option>
    <option value="instruct">instruct</option>
  </select>
  <div class="ctxwrap">
    <div class="ctxlabel" id="ctxlabel">контекст: 0 / 81920</div>
    <div class="ctxbar"><div id="ctxfill"></div></div>
  </div>
  <button id="stopbtn" disabled>Стоп</button>
</header>
<main>
  <aside>
    <div class="head"><span>Чаты</span><button id="newchat">+</button></div>
    <div id="chatlist"></div>
  </aside>
  <section>
    <div id="keyform">
      <h2>Нужен API-ключ</h2>
      <div class="err" id="keyerr">Сервер ответил 401. Введите ключ:</div>
      <input type="password" id="keyformkey" placeholder="API key">
      <button class="primary" id="keysave">Сохранить</button>
    </div>
    <div id="messages"></div>
    <details id="sampling">
      <summary>Сэмплинг</summary>
      <div class="grid">
        <label>temperature <input type="number" id="p_temperature" step="0.05" min="0" max="2"></label>
        <label>top_p <input type="number" id="p_top_p" step="0.01" min="0" max="1"></label>
        <label>top_k <input type="number" id="p_top_k" step="1" min="0"></label>
        <label>min_p <input type="number" id="p_min_p" step="0.01" min="0" max="1"></label>
        <label>presence_penalty <input type="number" id="p_presence_penalty" step="0.1"></label>
        <label>repetition_penalty <input type="number" id="p_repetition_penalty" step="0.05" min="0"></label>
        <label>max_tokens <input type="number" id="p_max_tokens" step="128" min="1"></label>
      </div>
    </details>
    <div id="composer">
      <textarea id="input" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button class="primary" id="send">Отправить</button>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const CTX_LEN = 81920; // BD-009; уточняется из /v1/models
let ctxLen = CTX_LEN;

// --- Пресеты сэмплинга (BD-016) ---
const PRESETS = {
  "thinking":        { temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0,   repetition_penalty: 1.0, max_tokens: 4096 },
  "thinking-coding": { temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0,   repetition_penalty: 1.0, max_tokens: 4096 },
  "instruct":        { temperature: 0.7, top_p: 0.80, top_k: 20, min_p: 0, presence_penalty: 1.5, repetition_penalty: 1.0, max_tokens: 4096 },
};
const PARAM_IDS = ["temperature","top_p","top_k","min_p","presence_penalty","repetition_penalty","max_tokens"];

// --- Хранилище (BD-005, BD-014: всё в localStorage) ---
const store = {
  get key() { return localStorage.getItem("q36_api_key") || ""; },
  set key(v) { v ? localStorage.setItem("q36_api_key", v) : localStorage.removeItem("q36_api_key"); },
  get chats() { try { return JSON.parse(localStorage.getItem("q36_chats") || "[]"); } catch { return []; } },
  set chats(v) { localStorage.setItem("q36_chats", JSON.stringify(v)); },
  get current() { return localStorage.getItem("q36_current") || ""; },
  set current(v) { localStorage.setItem("q36_current", v); },
};

// --- API ---
async function api(path, opts = {}) {
  opts.headers = Object.assign({ "Authorization": "Bearer " + store.key }, opts.headers || {});
  if (opts.body) opts.headers["Content-Type"] = "application/json";
  const r = await fetch(path, opts);
  if (r.status === 401) { showKeyForm(); throw new Error("401 Unauthorized"); }
  return r;
}

function showKeyForm() { $("keyform").style.display = "flex"; }
function hideKeyForm() { $("keyform").style.display = "none"; }

async function loadModels() {
  try {
    const r = await api("/v1/models");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const m = j.data && j.data[0];
    if (m) {
      hideKeyForm();
      if (m.context_length) ctxLen = m.context_length;
      $("modelinfo").textContent =
        [m.id, m.quant, "ctx " + (m.context_length || "?"), "slots " + (m.slots ?? "?")].filter(Boolean).join(" · ");
      if (m.id) { $("brand").textContent = m.id; document.title = m.id + " — чат"; }
    }
  } catch (e) {
    if (String(e.message).startsWith("401")) return; // форма ключа уже показана
    $("modelinfo").textContent = "сервер недоступен";
  }
}

// --- Чаты ---
function newChat(title) {
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
           title: title || "Новый чат", messages: [] }; // messages: [{role, content}]
}
function getChat() { return store.chats.find(c => c.id === store.current) || null; }
function saveChat(c) {
  const chats = store.chats;
  const i = chats.findIndex(x => x.id === c.id);
  if (i >= 0) chats[i] = c; else chats.unshift(c);
  store.chats = chats;
}
function renderChatList() {
  const el = $("chatlist");
  el.innerHTML = "";
  for (const c of store.chats) {
    const d = document.createElement("div");
    d.className = "chatitem" + (c.id === store.current ? " active" : "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = c.title; t.title = c.title;
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "Удалить";
    del.onclick = ev => {
      ev.stopPropagation();
      store.chats = store.chats.filter(x => x.id !== c.id);
      if (store.current === c.id) { store.current = (store.chats[0] || {}).id || ""; renderMessages(); }
      renderChatList();
    };
    d.onclick = () => { store.current = c.id; renderChatList(); renderMessages(); };
    d.append(t, del);
    el.append(d);
  }
}

// --- Thinking-парсер (эвристика) ---
// Поток дельт делим по маркерам <think>/<thinking> и </think>/</thinking> (модель
// эмитит их как спецтокены; если HTTP-слой отдаёт их текстом — поймаем здесь).
// Fallback: если маркеров нет, но включён thinking-режим — ведущий блок до первой
// пустой строки (\n\n) считаем рассуждением, остальное — ответом.
// Возвращает [{kind:"think"|"text", text}].
function parseThinking(text) {
  const re = /<(think|thinking)>([\s\S]*?)(?:<\/\1>|$)/i;
  const m = text.match(re);
  if (m) {
    const before = text.slice(0, m.index);
    const after = text.slice(m.index + m[0].length).replace(/^<\/(?:think|thinking)>/i, "");
    const parts = [];
    if (before.trim()) parts.push({ kind: "text", text: before });
    parts.push({ kind: "think", text: m[2].replace(/^\n+|\n+$/g, "") });
    if (after.trim()) parts.push({ kind: "text", text: after.replace(/^\n+/, "") });
    return parts;
  }
  const sep = text.indexOf("\n\n");
  if (sep > 0 && $("mode").value.startsWith("thinking") && text.slice(0, sep).length > 200) {
    return [{ kind: "think", text: text.slice(0, sep) }, { kind: "text", text: text.slice(sep + 2) }];
  }
  return [{ kind: "text", text }];
}

// --- Рендер сообщений ---
function renderMessages() {
  const el = $("messages");
  el.innerHTML = "";
  const c = getChat();
  if (!c) { updateCtxBar(); return; }
  for (const msg of c.messages) el.append(renderMsg(msg));
  updateCtxBar();
  el.scrollTop = el.scrollHeight;
}
function renderMsg(msg) {
  const d = document.createElement("div");
  d.className = "msg " + msg.role;
  const role = document.createElement("div");
  role.className = "role"; role.textContent = msg.role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (msg.role === "assistant") {
    for (const part of parseThinking(msg.content || "")) {
      if (part.kind === "think") {
        const det = document.createElement("details");
        det.className = "think";
        const sum = document.createElement("summary");
        sum.textContent = "thinking";
        const tc = document.createElement("div");
        tc.className = "tc"; tc.textContent = part.text;
        det.append(sum, tc);
        bubble.append(det);
      } else {
        const span = document.createElement("span");
        span.textContent = part.text;
        bubble.append(span);
      }
    }
  } else {
    bubble.textContent = msg.content;
  }
  d.append(role, bubble);
  if (msg.meta) {
    const meta = document.createElement("div");
    meta.className = "meta";
    if (msg.meta.tps) meta.append(span(meta.tps));
    if (msg.meta.toks) meta.append(span(msg.meta.toks));
    if (msg.meta.truncated) {
      const b = span("контекст обрезан");
      b.className = "trunc";
      meta.append(b);
    }
    d.append(meta);
  }
  return d;
  function span(t) { const s = document.createElement("span"); s.textContent = t; return s; }
}

// --- Прогресс контекста. Оценка chars/4 — грубая эвристика (≈4 символа/токен
// для смешанного текста); точный подсчёт возможен только на сервере. ---
function updateCtxBar() {
  const c = getChat();
  const chars = c ? c.messages.reduce((n, m) => n + (m.content || "").length, 0) : 0;
  const est = Math.ceil(chars / 4);
  const pct = Math.min(100, est / ctxLen * 100);
  $("ctxlabel").textContent = `контекст: ~${est} / ${ctxLen}`;
  const fill = $("ctxfill");
  fill.style.width = pct + "%";
  fill.classList.toggle("warn", pct > 90);
}

// --- Сэмплинг-панель ---
function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  for (const k of PARAM_IDS) $("p_" + k).value = p[k];
}
function readParams() {
  const o = {};
  for (const k of PARAM_IDS) o[k] = parseFloat($("p_" + k).value);
  o.top_k = Math.round(o.top_k);
  o.max_tokens = Math.round(o.max_tokens);
  return o;
}

// --- Отправка + SSE-стрим ---
let abortCtrl = null;

async function send() {
  const text = $("input").value.trim();
  if (!text || abortCtrl) return;
  let c = getChat();
  if (!c) { c = newChat(); store.current = c.id; }
  if (!c.messages.length) c.title = text.slice(0, 40);
  c.messages.push({ role: "user", content: text });
  $("input").value = "";

  const mode = $("mode").value;
  const messages = [];
  if (mode === "instruct") {
    // Аналог encode_no_think: инструктируем модель не рассуждать через system.
    // На сервере no-think суффикс (пустой think-блок) добавляет токенизатор.
    messages.push({ role: "system", content: "/no_think" });
  }
  messages.push(...c.messages.map(m => ({ role: m.role, content: m.content })));

  const body = Object.assign({
    model: "qwen3.6-27b",
    messages,
    stream: true,
    stream_options: { include_usage: true },
  }, readParams());

  const asst = { role: "assistant", content: "", meta: {} };
  c.messages.push(asst);
  saveChat(c);
  renderChatList();
  renderMessages();

  abortCtrl = new AbortController();
  $("stopbtn").disabled = false;
  $("send").disabled = true;

  let streamStart = null;
  const el = $("messages");
  let msgEl = renderMsg(asst);
  el.append(msgEl);
  el.scrollTop = el.scrollHeight;

  try {
    const r = await api("/v1/chat/completions", {
      method: "POST",
      body: JSON.stringify(body),
      signal: abortCtrl.signal,
    });
    if (!r.ok) throw new Error("HTTP " + r.status + ": " + await r.text());

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE: события разделены пустой строкой
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of ev.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          let j;
          try { j = JSON.parse(data); } catch { continue; }
          const delta = j.choices && j.choices[0] && j.choices[0].delta;
          if (delta && delta.content) {
            if (!streamStart) streamStart = performance.now();
            asst.content += delta.content;
          }
          // usage приходит финальным chunk (stream_options.include_usage)
          if (j.usage) {
            asst.meta.toks = "токены: " + (j.usage.completion_tokens ?? "?");
            const u = j.usage;
            if (u.truncated === true || (u.extra && u.extra.truncated) ||
                (j.choices && j.choices[0] && j.choices[0].truncated)) {
              asst.meta.truncated = true;
            }
          }
        }
        if (streamStart) {
          const secs = (performance.now() - streamStart) / 1000;
          // оценка completion-токенов: chars/4 (та же эвристика, что и ctx-бар)
          const estToks = Math.ceil(asst.content.length / 4);
          if (secs > 0.2) asst.meta.tps = estToks + " ток · ~" + (estToks / secs).toFixed(1) + " tok/s";
        }
        const fresh = renderMsg(asst);
        el.replaceChild(fresh, msgEl);
        msgEl = fresh;
        el.scrollTop = el.scrollHeight;
      }
    }
  } catch (e) {
    if (e.name !== "AbortError" && !String(e.message).startsWith("401")) {
      asst.content += "\n\n[ошибка: " + e.message + "]";
      const fresh = renderMsg(asst);
      el.replaceChild(fresh, msgEl);
    }
  } finally {
    abortCtrl = null;
    $("stopbtn").disabled = true;
    $("send").disabled = false;
    saveChat(c);
    renderMessages();
  }
}

// --- События ---
$("send").onclick = send;
$("stopbtn").onclick = () => { if (abortCtrl) abortCtrl.abort(); };
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("mode").onchange = () => applyPreset($("mode").value);
$("newchat").onclick = () => {
  const c = newChat();
  const chats = store.chats; chats.unshift(c); store.chats = chats;
  store.current = c.id;
  renderChatList(); renderMessages();
  $("input").focus();
};
$("apikey").addEventListener("change", () => { store.key = $("apikey").value.trim(); loadModels(); });
$("keysave").onclick = () => {
  store.key = $("keyformkey").value.trim();
  $("apikey").value = store.key;
  loadModels();
};

// --- Инициализация ---
$("apikey").value = store.key;
applyPreset($("mode").value);
if (!store.chats.length) { const c = newChat(); store.chats = [c]; store.current = c.id; }
else if (!getChat()) store.current = store.chats[0].id;
renderChatList();
renderMessages();
loadModels();
</script>
</body>
</html>
