<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.6 — чат</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f7f7f8; --bg3: #efeff1;
  --border: #e3e4e8; --border-soft: #ececf0;
  --fg: #1a1c22; --dim: #6b7280; --faint: #9ca3af;
  --accent: #4f46e5; --accent-soft: #eef0ff;
  --red: #dc2626; --green: #059669; --yellow: #b45309;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,16,20,.05);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
* { scrollbar-width: thin; scrollbar-color: #d4d4d8 transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
header .brand { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
header .badge { background: var(--bg2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
header input[type=password] { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 6px 10px; width: 200px; }
select, input[type=number] { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 5px 8px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
button { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-weight: 500; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: #4338ca; color: #fff; }
button:disabled { opacity: .4; cursor: default; }
.ctxwrap { flex: 1; min-width: 140px; max-width: 240px; }
.ctxbar { height: 4px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
.ctxbar > div { height: 100%; background: var(--green); width: 0; transition: width .25s; }
.ctxbar > div.warn { background: var(--red); }
.ctxlabel { font-size: 11px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }

main { flex: 1; display: flex; min-height: 0; }
aside { width: 230px; background: var(--bg2); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; }
aside .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; font-weight: 600; font-size: 13px; }
#chatlist { flex: 1; overflow-y: auto; padding: 6px; }
.chatitem { display: flex; align-items: center; padding: 8px 10px; cursor: pointer; gap: 8px; border-radius: var(--radius-sm); margin-bottom: 2px; color: var(--dim); }
.chatitem:hover { background: var(--bg3); color: var(--fg); }
.chatitem.active { background: var(--bg); color: var(--fg); box-shadow: var(--shadow); }
.chatitem .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.chatitem .del { color: var(--faint); border: none; background: none; padding: 0 4px; opacity: 0; transition: opacity .12s; }
.chatitem:hover .del { opacity: 1; }
.chatitem .del:hover { color: var(--red); }

section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#messages { flex: 1; overflow-y: auto; padding: 24px; }
.msg { margin: 0 auto 20px; max-width: 780px; }
.msg .role { font-size: 10.5px; color: var(--faint); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.msg .bubble { padding: 4px 0; line-height: 1.65; }
.msg.user .bubble { background: var(--bg2); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 10px 16px; width: fit-content; margin-left: auto; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
.msg.user .role { text-align: right; }
.msg .meta { font-size: 11px; color: var(--faint); margin-top: 6px; display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
.msg .meta .trunc { color: var(--yellow); }
.msg.streaming .bubble::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* markdown */
.msg .bubble p { margin: 0 0 .6em; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble h1, .msg .bubble h2, .msg .bubble h3 { margin: .9em 0 .4em; line-height: 1.3; }
.msg .bubble h1 { font-size: 1.25em; } .msg .bubble h2 { font-size: 1.15em; } .msg .bubble h3 { font-size: 1.05em; }
.msg .bubble code { font-family: var(--mono); font-size: .88em; background: var(--bg3); border-radius: 5px; padding: 1px 5px; }
.msg .bubble pre { background: #0f172a; color: #e2e8f0; border-radius: var(--radius-sm); padding: 12px 14px; overflow-x: auto; margin: .6em 0; }
.msg .bubble pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
.msg .bubble ul, .msg .bubble ol { margin: .4em 0; padding-left: 1.4em; }
.msg .bubble blockquote { margin: .6em 0; padding: 2px 14px; border-left: 3px solid var(--border); color: var(--dim); }
.msg .bubble table { border-collapse: collapse; margin: .6em 0; font-size: 13px; }
.msg .bubble th, .msg .bubble td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.msg .bubble th { background: var(--bg2); }

details.think { margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg2); overflow: hidden; }
details.think summary { cursor: pointer; color: var(--dim); font-size: 12px; font-weight: 500; padding: 8px 14px; user-select: none; }
details.think summary::before { content: "🧠 "; }
details.think[open] summary { border-bottom: 1px solid var(--border-soft); }
details.think .tc { white-space: pre-wrap; word-break: break-word; color: var(--dim); font-size: 13px; padding: 10px 14px; max-height: 320px; overflow-y: auto; }

#composer { display: flex; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--border-soft); background: var(--bg); }
#input { flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius); padding: 11px 16px; font: inherit; min-height: 48px; max-height: 200px; }
#composer .primary { border-radius: var(--radius); padding: 0 24px; }
#sampling { border-top: 1px solid var(--border-soft); background: var(--bg2); }
#sampling summary { padding: 7px 24px; cursor: pointer; color: var(--dim); font-size: 12px; font-weight: 500; }
#sampling .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 16px; padding: 6px 24px 14px; }
#sampling label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
#sampling input { width: 76px; }
#keyform { margin: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; display: none; flex-direction: column; gap: 14px; width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
#keyform h2 { margin: 0; font-size: 17px; }
#keyform input { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 8px 12px; }
.err { color: var(--red); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="brand" id="brand">Qwen3.6</span>
  <span id="modelinfo" class="badge">…</span>
  <input type="password" id="apikey" placeholder="API key" autocomplete="off">
  <select id="mode" title="Режим / пресет сэмплинга">
    <option value="thinking">thinking</option>
    <option value="thinking-coding">thinking-coding</option>
    <option value="instruct">instruct</option>
  </select>
  <div class="ctxwrap">
    <div class="ctxlabel" id="ctxlabel">контекст: 0 / 81920</div>
    <div class="ctxbar"><div id="ctxfill"></div></div>
  </div>
  <button id="stopbtn" disabled>Стоп</button>
</header>
<main>
  <aside>
    <div class="head"><span>Чаты</span><button id="newchat">+</button></div>
    <div id="chatlist"></div>
  </aside>
  <section>
    <div id="messages"></div>
    <details id="sampling">
      <summary>Параметры сэмплинга</summary>
      <div class="grid">
        <label>temperature <input type="number" id="p_temperature" step="0.05" min="0"></label>
        <label>top_p <input type="number" id="p_top_p" step="0.01" min="0" max="1"></label>
        <label>top_k <input type="number" id="p_top_k" step="1" min="0"></label>
        <label>min_p <input type="number" id="p_min_p" step="0.01" min="0" max="1"></label>
        <label>presence_penalty <input type="number" id="p_presence_penalty" step="0.05" min="0"></label>
        <label>repetition_penalty <input type="number" id="p_repetition_penalty" step="0.05" min="0"></label>
        <label>max_tokens <input type="number" id="p_max_tokens" step="128" min="1"></label>
      </div>
    </details>
    <div id="composer">
      <textarea id="input" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button class="primary" id="send">Отправить</button>
    </div>
  </section>
</main>
<div id="keyform">
  <h2>API key</h2>
  <input type="password" id="keyformkey" placeholder="Введите мастер-ключ" autocomplete="off">
  <button class="primary" id="keysave">Сохранить</button>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const CTX_LEN = 81920; // BD-009; уточняется из /v1/models
let ctxLen = CTX_LEN;
let modelId = "qwen3.6"; // уточняется из /v1/models

// --- Пресеты сэмплинга (BD-016) ---
const PRESETS = {
  "thinking":        { temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0,   repetition_penalty: 1.0, max_tokens: 4096 },
  "thinking-coding": { temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0,   repetition_penalty: 1.0, max_tokens: 4096 },
  "instruct":        { temperature: 0.7, top_p: 0.80, top_k: 20, min_p: 0, presence_penalty: 1.5, repetition_penalty: 1.0, max_tokens: 4096 },
};
const PARAM_IDS = ["temperature","top_p","top_k","min_p","presence_penalty","repetition_penalty","max_tokens"];

// --- Хранилище (BD-005, BD-014: всё в localStorage) ---
const store = {
  get key() { return localStorage.getItem("q36_api_key") || ""; },
  set key(v) { v ? localStorage.setItem("q36_api_key", v) : localStorage.removeItem("q36_api_key"); },
  get chats() { try { return JSON.parse(localStorage.getItem("q36_chats") || "[]"); } catch { return []; } },
  set chats(v) { localStorage.setItem("q36_chats", JSON.stringify(v)); },
  get current() { return localStorage.getItem("q36_current") || ""; },
  set current(v) { localStorage.setItem("q36_current", v); },
};

// --- API ---
async function api(path, opts = {}) {
  opts.headers = Object.assign({ "Authorization": "Bearer " + store.key }, opts.headers || {});
  if (opts.body) opts.headers["Content-Type"] = "application/json";
  const r = await fetch(path, opts);
  if (r.status === 401) { showKeyForm(); throw new Error("401 Unauthorized"); }
  return r;
}

function showKeyForm() { $("keyform").style.display = "flex"; }
function hideKeyForm() { $("keyform").style.display = "none"; }

async function loadModels() {
  try {
    const r = await api("/v1/models");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const m = j.data && j.data[0];
    if (m) {
      hideKeyForm();
      if (m.context_length) ctxLen = m.context_length;
      if (m.id) modelId = m.id;
      $("modelinfo").textContent =
        [m.id, m.quant, "ctx " + (m.context_length || "?"), "slots " + (m.slots ?? "?")].filter(Boolean).join(" · ");
      if (m.id) { $("brand").textContent = m.id; document.title = m.id + " — чат"; }
    }
  } catch (e) {
    if (String(e.message).startsWith("401")) return;
    $("modelinfo").textContent = "сервер недоступен";
  }
}

// --- Чаты ---
function newChat(title) {
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
           title: title || "Новый чат", messages: [] };
}
function getChat() { return store.chats.find(c => c.id === store.current) || null; }
function saveChat(c) {
  const chats = store.chats;
  const i = chats.findIndex(x => x.id === c.id);
  if (i >= 0) chats[i] = c; else chats.unshift(c);
  store.chats = chats;
}
function renderChatList() {
  const el = $("chatlist");
  el.innerHTML = "";
  for (const c of store.chats) {
    const d = document.createElement("div");
    d.className = "chatitem" + (c.id === store.current ? " active" : "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = c.title; t.title = c.title;
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "Удалить";
    del.onclick = ev => {
      ev.stopPropagation();
      store.chats = store.chats.filter(x => x.id !== c.id);
      if (store.current === c.id) { store.current = (store.chats[0] || {}).id || ""; renderMessages(); }
      renderChatList();
    };
    d.onclick = () => { store.current = c.id; renderChatList(); renderMessages(); };
    d.append(t, del);
    el.append(d);
  }
}

// --- Минимальный markdown (без зависимостей): escape → fences → blocks → inline ---
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function renderMarkdown(src) {
  // Fenced code blocks — вырезаем до остальных трансформаций (с placeholder).
  const fences = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
    fences.push('<pre><code>' + escapeHtml(code.replace(/\n$/, "")) + '</code></pre>');
    return "\u0000" + (fences.length - 1) + "\u0000";
  });
  s = escapeHtml(s);
  // Блочные конструкции по строкам.
  const lines = s.split("\n");
  let html = "", inList = null, para = [];
  const flushPara = () => {
    if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; }
  };
  const flushList = () => {
    if (inList) { html += "</" + inList + ">"; inList = null; }
  };
  for (const line of lines) {
    const fencePh = line.match(/^\u0000(\d+)\u0000$/);
    if (fencePh) { flushPara(); flushList(); html += fences[+fencePh[1]]; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { flushPara(); flushList(); html += "<h" + h[1].length + ">" + inlineMd(h[2]) + "</h" + h[1].length + ">"; continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { flushPara(); if (inList !== "ul") { flushList(); html += "<ul>"; inList = "ul"; } html += "<li>" + inlineMd(ul[1]) + "</li>"; continue; }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { flushPara(); if (inList !== "ol") { flushList(); html += "<ol>"; inList = "ol"; } html += "<li>" + inlineMd(ol[1]) + "</li>"; continue; }
    if (line.trim() === "") { flushPara(); flushList(); continue; }
    flushList();
    para.push(inlineMd(line));
  }
  flushPara(); flushList();
  return html;
}
function inlineMd(s) {
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

// --- Thinking-парсер ---
function parseThinking(text) {
  const re = /<(think|thinking)>([\s\S]*?)(?:<\/\1>|$)/i;
  const m = text.match(re);
  if (m) {
    const before = text.slice(0, m.index);
    const after = text.slice(m.index + m[0].length).replace(/^<\/(?:think|thinking)>/i, "");
    const parts = [];
    if (before.trim()) parts.push({ kind: "text", text: before });
    parts.push({ kind: "think", text: m[2].replace(/^\n+|\n+$/g, "") });
    if (after.trim()) parts.push({ kind: "text", text: after.replace(/^\n+/, "") });
    return parts;
  }
  const sep = text.indexOf("\n\n");
  if (sep > 0 && $("mode").value.startsWith("thinking") && text.slice(0, sep).length > 200) {
    return [{ kind: "think", text: text.slice(0, sep) }, { kind: "text", text: text.slice(sep + 2) }];
  }
  return [{ kind: "text", text }];
}

// --- Рендер сообщений (без мигания: структура DOM не пересоздаётся при стриме) ---
function renderMessages() {
  const el = $("messages");
  el.innerHTML = "";
  const c = getChat();
  if (!c) { updateCtxBar(); return; }
  for (const msg of c.messages) el.append(renderMsg(msg, false));
  updateCtxBar();
  el.scrollTop = el.scrollHeight;
}
function renderMsg(msg, streaming) {
  const d = document.createElement("div");
  d.className = "msg " + msg.role + (streaming ? " streaming" : "");
  const role = document.createElement("div");
  role.className = "role"; role.textContent = msg.role === "user" ? "вы" : "модель";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  d.append(role, bubble);
  fillBubble(bubble, msg, streaming);
  if (msg.meta && (msg.meta.stats || msg.meta.truncated)) {
    const meta = document.createElement("div");
    meta.className = "meta";
    if (msg.meta.stats) { const s = document.createElement("span"); s.textContent = msg.meta.stats; meta.append(s); }
    if (msg.meta.truncated) { const b = document.createElement("span"); b.className = "trunc"; b.textContent = "контекст обрезан"; meta.append(b); }
    d.append(meta);
  }
  return d;
}
// Наполнение баббла отдельно от создания ноды — стрим обновляет только его.
function fillBubble(bubble, msg, streaming) {
  bubble.innerHTML = "";
  if (msg.role === "assistant") {
    for (const part of parseThinking(msg.content || "")) {
      if (part.kind === "think") {
        const det = document.createElement("details");
        det.className = "think";
        det.open = !!streaming; // во время стрима рассуждения видны, потом сворачиваются
        const sum = document.createElement("summary");
        const words = part.text.trim().split(/\s+/).filter(Boolean).length;
        sum.textContent = "Рассуждения" + (words ? " · " + words + " слов" : "");
        const tc = document.createElement("div");
        tc.className = "tc"; tc.textContent = part.text;
        det.append(sum, tc);
        bubble.append(det);
      } else {
        const span = document.createElement("div");
        span.innerHTML = renderMarkdown(part.text);
        bubble.append(span);
      }
    }
  } else {
    bubble.textContent = msg.content;
  }
}

// --- Прогресс контекста ---
function updateCtxBar() {
  const c = getChat();
  const chars = c ? c.messages.reduce((n, m) => n + (m.content || "").length, 0) : 0;
  const est = Math.ceil(chars / 4);
  const pct = Math.min(100, est / ctxLen * 100);
  $("ctxlabel").textContent = `контекст: ~${est} / ${ctxLen}`;
  const fill = $("ctxfill");
  fill.style.width = pct + "%";
  fill.classList.toggle("warn", pct > 90);
}

// --- Сэмплинг-панель ---
function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  for (const k of PARAM_IDS) $("p_" + k).value = p[k];
}
function readParams() {
  const o = {};
  for (const k of PARAM_IDS) o[k] = parseFloat($("p_" + k).value);
  o.top_k = Math.round(o.top_k);
  o.max_tokens = Math.round(o.max_tokens);
  return o;
}

// --- Отправка + SSE-стрим ---
let abortCtrl = null;

async function send() {
  const text = $("input").value.trim();
  if (!text || abortCtrl) return;
  let c = getChat();
  if (!c) { c = newChat(); store.current = c.id; }
  if (!c.messages.length) c.title = text.slice(0, 40);
  c.messages.push({ role: "user", content: text });
  $("input").value = "";

  const mode = $("mode").value;
  const messages = [];
  if (mode === "instruct") {
    messages.push({ role: "system", content: "/no_think" });
  }
  messages.push(...c.messages.map(m => ({ role: m.role, content: m.content })));

  const body = Object.assign({
    model: modelId,
    messages,
    stream: true,
    stream_options: { include_usage: true },
  }, readParams());

  const asst = { role: "assistant", content: "", meta: {} };
  c.messages.push(asst);
  saveChat(c);
  renderChatList();

  abortCtrl = new AbortController();
  $("stopbtn").disabled = false;
  $("send").disabled = true;

  const el = $("messages");
  let msgEl = renderMsg(asst, true);
  el.append(msgEl);
  el.scrollTop = el.scrollHeight;
  const bubble = msgEl.querySelector(".bubble");

  // Перерисовка баббла максимум раз в кадр — без мигания и лишней работы.
  let dirty = false, rafScheduled = false;
  const scheduleRedraw = () => {
    dirty = true;
    if (rafScheduled) return;
    rafScheduled = true;
    requestAnimationFrame(() => {
      rafScheduled = false;
      if (!dirty) return;
      dirty = false;
      fillBubble(bubble, asst, true);
      el.scrollTop = el.scrollHeight;
    });
  };

  let firstDeltaAt = null;
  let usage = null, finishReason = null;
  const t0 = performance.now();

  try {
    const r = await api("/v1/chat/completions", {
      method: "POST",
      body: JSON.stringify(body),
      signal: abortCtrl.signal,
    });
    if (!r.ok) throw new Error("HTTP " + r.status + ": " + await r.text());

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of ev.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          let j;
          try { j = JSON.parse(data); } catch { continue; }
          const ch = j.choices && j.choices[0];
          const delta = ch && ch.delta;
          if (delta && delta.content) {
            if (!firstDeltaAt) firstDeltaAt = performance.now();
            asst.content += delta.content;
            scheduleRedraw();
          }
          if (ch && ch.finish_reason) finishReason = ch.finish_reason;
          if (j.usage) {
            usage = j.usage;
            if (usage.truncated === true) asst.meta.truncated = true;
          }
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError" && !String(e.message).startsWith("401")) {
      asst.content += "\n\n[ошибка: " + e.message + "]";
    }
  } finally {
    abortCtrl = null;
    $("stopbtn").disabled = true;
    $("send").disabled = false;

    // Финальная статистика: токены in/out, реальная скорость, время, finish.
    const totalSecs = (performance.now() - t0) / 1000;
    const parts = [];
    if (usage) {
      const out = usage.completion_tokens ?? null;
      const inp = usage.prompt_tokens ?? null;
      if (inp != null || out != null) parts.push("in " + (inp ?? "?") + " · out " + (out ?? "?"));
      if (out != null && firstDeltaAt) {
        const genSecs = (performance.now() - firstDeltaAt) / 1000;
        if (genSecs > 0.1) parts.push(out / genSecs >= 10
          ? (out / genSecs).toFixed(0) + " tok/s"
          : (out / genSecs).toFixed(1) + " tok/s");
      }
    }
    parts.push(totalSecs.toFixed(1) + "s");
    if (finishReason) parts.push(finishReason);
    if (finishReason == null && !usage && asst.content) parts.push("прервано");
    asst.meta.stats = parts.join(" · ");

    saveChat(c);
    renderMessages();
  }
}

// --- События ---
$("send").onclick = send;
$("stopbtn").onclick = () => { if (abortCtrl) abortCtrl.abort(); };
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("mode").onchange = () => applyPreset($("mode").value);
$("newchat").onclick = () => {
  const c = newChat();
  const chats = store.chats; chats.unshift(c); store.chats = chats;
  store.current = c.id;
  renderChatList(); renderMessages();
  $("input").focus();
};
$("apikey").addEventListener("change", () => { store.key = $("apikey").value.trim(); loadModels(); });
$("keysave").onclick = () => {
  store.key = $("keyformkey").value.trim();
  $("apikey").value = store.key;
  loadModels();
};

// --- Инициализация ---
$("apikey").value = store.key;
applyPreset($("mode").value);
if (!store.chats.length) { const c = newChat(); store.chats = [c]; store.current = c.id; }
else if (!getChat()) store.current = store.chats[0].id;
renderChatList();
renderMessages();
loadModels();
</script>
</body>
</html>
