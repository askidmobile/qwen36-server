<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3.6 — чат</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f7f7f8; --bg3: #efeff1;
  --border: #e3e4e8; --border-soft: #ececf0;
  --fg: #1a1c22; --dim: #6b7280; --faint: #9ca3af;
  --accent: #4f46e5; --accent-soft: #eef0ff;
  --red: #dc2626; --green: #059669; --yellow: #b45309;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,16,20,.05);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}
html[data-theme="dark"] {
  --bg: #14161c; --bg2: #1a1d25; --bg3: #232733;
  --border: #2c3140; --border-soft: #232733;
  --fg: #e5e7eb; --dim: #9ca3af; --faint: #6b7280;
  --accent: #818cf8; --accent-soft: rgba(99,102,241,.18);
  --red: #f87171; --green: #34d399; --yellow: #fbbf24;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
html[data-theme="dark"] .msg .bubble pre { background: #0b0f1a; color: #d5dceb; }
* { box-sizing: border-box; }
* { scrollbar-width: thin; scrollbar-color: #d4d4d8 transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
header .brand { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
header .badge { background: var(--bg2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
header input[type=password] { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 6px 10px; width: 200px; }

/* server panel */
#backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
#backdrop.open { opacity: 1; pointer-events: auto; }
#serverpanel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 92vw; background: var(--bg); border-left: 1px solid var(--border); box-shadow: -8px 0 30px rgba(0,0,0,.12); transform: translateX(100%); transition: transform .22s ease-out; z-index: 61; display: flex; flex-direction: column; overflow-y: auto; }
#serverpanel.open { transform: translateX(0); }
#serverpanel .phead { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--bg); z-index: 1; }
#serverpanel .phead h2 { margin: 0; font-size: 16px; }
#serverpanel section { padding: 14px 18px; border-bottom: 1px solid var(--border-soft); }
#serverpanel h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
#serverpanel .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
#serverpanel select, #serverpanel input[type=text], #serverpanel input[type=password] { width: 100%; }
#serverpanel #modelsel { width: 100%; font-family: var(--mono); font-size: 11.5px; }
#curinfo { background: var(--bg2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; margin-bottom: 10px; }
#curinfo .q { color: var(--dim); font-size: 11.5px; margin-top: 4px; }
.hfrepo { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); margin-bottom: 8px; overflow: hidden; }
.hfrepo > .rhead { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; }
.hfrepo > .rhead:hover { background: var(--bg2); }
.hfrepo .rname { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hfrepo .rmeta { font-size: 11px; color: var(--faint); white-space: nowrap; }
.hfrepo .rfiles { display: none; border-top: 1px solid var(--border-soft); }
.hfrepo.open .rfiles { display: block; }
.hffile { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; border-top: 1px solid var(--border-soft); }
.hffile .fname { flex: 1; font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hffile .fsize { color: var(--faint); white-space: nowrap; font-size: 11px; }
.hffile button { padding: 3px 10px; font-size: 11.5px; }
.badge-fit { color: var(--green); font-weight: 600; font-size: 11px; }
.badge-nofit { color: var(--red); font-weight: 600; font-size: 11px; }
.badge-info { color: var(--dim); font-size: 11px; }
.dlbar { margin: 8px 0; font-size: 11.5px; }
.dlbar .dlname { font-family: var(--mono); font-size: 10.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlbar .dltrack { height: 5px; background: var(--bg3); border-radius: 999px; overflow: hidden; margin-top: 3px; }
.dlbar .dlfill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.dlbar .dlstat { color: var(--faint); margin-top: 2px; }
select, input[type=number] { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 5px 8px; }
input:focus, select:focus, textarea:focus, button:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
button { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; font-weight: 500; transition: border-color .15s, background .15s; }
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: #4338ca; color: #fff; }
button:disabled { opacity: .4; cursor: default; }
.ctxwrap { flex: 1; min-width: 140px; max-width: 240px; }
.ctxbar { height: 4px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
.ctxbar > div { height: 100%; background: var(--green); width: 0; transition: width .25s; }
.ctxbar > div.warn { background: var(--red); }
.ctxlabel { font-size: 11px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }

main { flex: 1; display: flex; min-height: 0; }
aside { width: 230px; background: var(--bg2); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; }
aside .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; font-weight: 600; font-size: 13px; }
#chatlist { flex: 1; overflow-y: auto; padding: 6px; }
.chatitem { display: flex; align-items: center; padding: 8px 10px; cursor: pointer; gap: 8px; border-radius: var(--radius-sm); margin-bottom: 2px; color: var(--dim); }
.chatitem:hover { background: var(--bg3); color: var(--fg); }
.chatitem.active { background: var(--bg); color: var(--fg); box-shadow: var(--shadow); }
.chatitem .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.chatitem .del { color: var(--faint); border: none; background: none; padding: 0 4px; opacity: 0; transition: opacity .12s; }
.chatitem:hover .del { opacity: 1; }
.chatitem .del:hover { color: var(--red); }

section { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#messages { flex: 1; overflow-y: auto; padding: 24px; }
.msg { margin: 0 auto 20px; max-width: 780px; }
.msg .role { font-size: 10.5px; color: var(--faint); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.msg .bubble { padding: 4px 0; line-height: 1.65; }
.msg.user .bubble { background: var(--bg2); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 10px 16px; width: fit-content; margin-left: auto; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
.msg.user .role { text-align: right; }
.msg .meta { font-size: 11px; color: var(--faint); margin-top: 6px; display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
.msg .meta .trunc { color: var(--yellow); }
.msg.streaming .bubble::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* markdown */
.msg .bubble p { margin: 0 0 .6em; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg .bubble h1, .msg .bubble h2, .msg .bubble h3, .msg .bubble h4, .msg .bubble h5, .msg .bubble h6 { margin: .9em 0 .4em; line-height: 1.3; }
.msg .bubble h1 { font-size: 1.25em; } .msg .bubble h2 { font-size: 1.15em; } .msg .bubble h3 { font-size: 1.05em; }
.msg .bubble h4 { font-size: 1em; } .msg .bubble h5, .msg .bubble h6 { font-size: .95em; color: var(--dim); }
.msg .bubble code { font-family: var(--mono); font-size: .88em; background: var(--bg3); border-radius: 5px; padding: 1px 5px; }
.msg .bubble pre { background: #0f172a; color: #e2e8f0; border-radius: var(--radius-sm); padding: 12px 14px; overflow-x: auto; margin: .6em 0; }
.msg .bubble pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
.msg .bubble ul, .msg .bubble ol { margin: .4em 0; padding-left: 1.4em; }
.msg .bubble blockquote { margin: .6em 0; padding: 2px 14px; border-left: 3px solid var(--border); color: var(--dim); }
.msg .bubble table { border-collapse: collapse; margin: .6em 0; font-size: 13px; }
.msg .bubble th, .msg .bubble td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.msg .bubble th { background: var(--bg2); }

details.think { margin-bottom: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg2); overflow: hidden; }
details.think summary { cursor: pointer; color: var(--dim); font-size: 12px; font-weight: 500; padding: 8px 14px; user-select: none; }
details.think summary::before { content: "🧠 "; }
details.think[open] summary { border-bottom: 1px solid var(--border-soft); }
details.think .tc { word-break: break-word; color: var(--dim); font-size: 13px; padding: 10px 14px; max-height: 320px; overflow-y: auto; }
details.think .tc code { background: var(--bg3); }
details.think .tc pre { opacity: .9; }

/* Attachments preview & tray */
#tray { display: none; gap: 10px; padding: 8px 24px; background: var(--bg2); border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
.att-card { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; max-width: 260px; }
.att-card img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
.att-card .info { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-card .remove { border: none; background: none; color: var(--faint); cursor: pointer; padding: 0 4px; font-size: 13px; }
.att-card .remove:hover { color: var(--red); }

#composer { display: flex; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--border-soft); background: var(--bg); align-items: flex-end; }
#input { flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius); padding: 11px 16px; font: inherit; min-height: 48px; max-height: 200px; }
#composer .primary { border-radius: var(--radius); padding: 0 24px; height: 48px; }
#attachbtn { border-radius: var(--radius); height: 48px; padding: 0 16px; font-size: 18px; line-height: 1; }
#thinkbtn { border-radius: var(--radius); height: 48px; padding: 0 14px; font-size: 12px; font-weight: 600; white-space: nowrap; transition: all .15s; color: var(--dim); background: var(--bg2); border: 1px solid var(--border); }
#thinkbtn.think-active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

#dropzone { display: none; position: absolute; inset: 0; background: rgba(79, 70, 229, 0.08); border: 2px dashed var(--accent); z-index: 10; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: var(--accent); pointer-events: none; }
#dropzone.active { display: flex; }

#sampling { border-top: 1px solid var(--border-soft); background: var(--bg2); }
#sampling summary { padding: 7px 24px; cursor: pointer; color: var(--dim); font-size: 12px; font-weight: 500; }
#sampling .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 16px; padding: 6px 24px 14px; }
#sampling label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
#sampling input { width: 76px; }
#keyform { margin: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; display: none; flex-direction: column; gap: 14px; width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
#keyform h2 { margin: 0; font-size: 17px; }
#keyform input { background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 8px 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

/* message actions */
.msg .actions { display: flex; gap: 4px; margin-top: 4px; opacity: 0; transition: opacity .12s; }
.msg:hover .actions, .msg:focus-within .actions { opacity: 1; }
.msg .actions button { border: none; background: none; color: var(--faint); padding: 2px 6px; font-size: 12px; cursor: pointer; border-radius: 5px; }
.msg .actions button:hover { color: var(--accent); background: var(--bg3); }
/* code block header */
.codewrap { position: relative; margin: .6em 0; }
.codewrap .codebar { display: flex; justify-content: space-between; align-items: center; background: #0f172a; color: #94a3b8; font-family: var(--mono); font-size: 10.5px; padding: 6px 14px 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
html[data-theme="dark"] .codewrap .codebar { background: #0b0f1a; }
.codewrap pre { margin: 0 !important; border-radius: 0 0 var(--radius-sm) var(--radius-sm) !important; }
.codewrap .codebar button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 11px; padding: 2px 6px; }
.codewrap .codebar button:hover { color: #e2e8f0; }
/* toasts */
#toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast { background: var(--fg); color: var(--bg); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); animation: toastin .18s ease-out; max-width: 320px; }
.toast.err { background: var(--red); color: #fff; }
@keyframes toastin { from { transform: translateY(8px); opacity: 0; } }
/* composer counter + system prompt */
#composerwrap { position: relative; }
#tokcount { position: absolute; bottom: -16px; right: 26px; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
#sysprompt { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: var(--radius-sm); padding: 7px 10px; font: inherit; font-size: 12.5px; min-height: 36px; resize: vertical; margin-top: 6px; }
#modelfilter { width: 150px; }
</style>
</head>
<body>
<header>
  <span class="brand" id="brand">Qwen3.6</span>
  <span id="modelinfo" class="badge">…</span>
  <input type="password" id="apikey" placeholder="API key" autocomplete="off" aria-label="API Key">
  <select id="mode" title="Быстрый режим генерирует ответ сразу; thinking сначала пишет рассуждение" aria-label="Режим генерации">
    <option value="instruct" selected>быстро · без рассуждений (general)</option>
    <option value="instruct-reasoning">быстро · рассуждения без тегов (reasoning)</option>
    <option value="thinking">thinking · общее</option>
    <option value="thinking-coding">thinking · код (WebDev)</option>
  </select>
  <div class="ctxwrap">
    <div class="ctxlabel" id="ctxlabel">контекст: 0 / 81920</div>
    <div class="ctxbar"><div id="ctxfill"></div></div>
  </div>
  <button id="stopbtn" disabled>Стоп</button>
  <button id="themebtn" title="Светлая/тёмная тема" aria-label="Переключить тему">🌓</button>
  <button id="serverbtn" title="Управление сервером" aria-label="Управление сервером" aria-haspopup="dialog">⚙ Сервер</button>
</header>
<main>
  <aside>
    <div class="head"><span>Чаты</span><button id="newchat" aria-label="Новый чат">+</button></div>
    <div id="chatlist"></div>
  </aside>
  <section id="chatarea">
    <div id="dropzone">Перетащите изображения или видео сюда</div>
    <div id="messages" role="log" aria-live="polite"></div>
    <div id="tray" aria-label="Прикреплённые файлы"></div>
    <details id="sampling">
      <summary>Параметры сэмплинга</summary>
      <div class="grid">
        <label>temperature <input type="number" id="p_temperature" step="0.05" min="0"></label>
        <label>top_p <input type="number" id="p_top_p" step="0.01" min="0" max="1"></label>
        <label>top_k <input type="number" id="p_top_k" step="1" min="0"></label>
        <label>min_p <input type="number" id="p_min_p" step="0.01" min="0" max="1"></label>
        <label>presence_penalty <input type="number" id="p_presence_penalty" step="0.05" min="0"></label>
        <label>repetition_penalty <input type="number" id="p_repetition_penalty" step="0.05" min="0"></label>
        <label>max_tokens <input type="number" id="p_max_tokens" step="128" min="1"></label>
      </div>
      <div style="padding: 0 24px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap">
        <button id="savedefaults" title="Записать текущие параметры в .env как дефолтные">Сохранить по умолчанию</button>
        <button id="savepreset" title="Записать текущие параметры как пресет выбранного режима">Сохранить как пресет режима</button>
      </div>
      <div style="padding: 0 24px 14px">
        <label for="sysprompt" style="font-size:12px;color:var(--dim)">System prompt (для текущего чата)</label>
        <textarea id="sysprompt" placeholder="Например: Ты — краткий технический ассистент…" aria-label="System prompt"></textarea>
      </div>
    </details>
    <div id="composer">
      <input type="file" id="fileinput" class="sr-only" multiple accept="image/*,video/*">
      <button id="attachbtn" type="button" title="Прикрепить изображение или видео" aria-label="Прикрепить медиафайл">📎</button>
      <button id="thinkbtn" type="button" class="think-active" title="Режим рассуждений (мышление)" aria-label="Переключить рассуждения">🧠 ВКЛ</button>
      <textarea id="input" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)" aria-label="Текст сообщения"></textarea>
      <div id="tokcount"></div>
      <button class="primary" id="send">Отправить</button>
    </div>
  </section>
</main>
<div id="announcer" class="sr-only" aria-live="assertive"></div>
<div id="toasts" aria-live="polite"></div>
<div id="backdrop"></div>
<aside id="serverpanel" role="dialog" aria-modal="true" aria-label="Управление сервером">
  <div class="phead"><h2>Управление сервером</h2><button id="panelclose" aria-label="Закрыть панель">✕</button></div>
  <section>
    <h3>Текущая модель</h3>
    <div id="curinfo">—</div>
    <button id="unloadbtn" title="Выгрузить модель, освободить VRAM">⏏ Выгрузить модель</button>
  </section>
  <section>
    <h3>Локальные модели</h3>
    <div class="row"><input id="modelfilter" type="text" placeholder="фильтр…" aria-label="Фильтр моделей" autocomplete="off"></div>
    <div class="row"><select id="modelsel" size="9" aria-label="Выбор модели"></select></div>
    <div class="row">
      <select id="ctxsel" title="Контекст" aria-label="Контекстное окно"></select>
      <select id="slotssel" title="Параллельные слоты" aria-label="Слоты"></select>
      <button id="applymodel" class="primary" title="Переключить модель/контекст">Применить</button>
    </div>
  </section>
  <section>
    <h3>HuggingFace</h3>
    <div class="row">
      <input id="hfq" type="text" placeholder="Найти GGUF (напр. qwen3.5)…" aria-label="Поиск на HuggingFace" autocomplete="off">
      <button id="hfsearchbtn" class="primary">Найти</button>
    </div>
    <div id="hfresults"></div>
    <div id="hfdownloads"></div>
  </section>
</aside>
<div id="keyform">
  <h2>API key</h2>
  <input type="password" id="keyformkey" placeholder="Введите мастер-ключ" autocomplete="off">
  <button class="primary" id="keysave">Сохранить</button>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const announce = msg => { $("announcer").textContent = msg; };
let ctxLen = 81920;
let modelId = "qwen3.6";

// Tab-memory attachments storage (not in localStorage per FR-030)
let activeAttachments = []; // Array of { id, file, kind, url, previewUrl, name, size }

const PRESETS = {
  "thinking":        { temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0,   repetition_penalty: 1.0, max_tokens: 4096 },
  "thinking-coding": { temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0,   repetition_penalty: 1.0, max_tokens: 4096 },
  "instruct":        { temperature: 0.7, top_p: 0.80, top_k: 20, min_p: 0, presence_penalty: 1.5, repetition_penalty: 1.0, max_tokens: 4096 },
};
// Серверные пресеты (.env) перекрывают встроенные при загрузке модели.
const SERVER_PRESETS = {};
const PARAM_IDS = ["temperature","top_p","top_k","min_p","presence_penalty","repetition_penalty","max_tokens"];

const store = {
  get key() { return localStorage.getItem("q36_api_key") || ""; },
  get mode() { return localStorage.getItem("q36_mode") || "instruct"; },
  set mode(v) { localStorage.setItem("q36_mode", v); },
  set key(v) { v ? localStorage.setItem("q36_api_key", v) : localStorage.removeItem("q36_api_key"); },
  get chats() { try { return JSON.parse(localStorage.getItem("q36_chats") || "[]"); } catch { return []; } },
  set chats(v) { localStorage.setItem("q36_chats", JSON.stringify(v)); },
  get current() { return localStorage.getItem("q36_current") || ""; },
  set current(v) { localStorage.setItem("q36_current", v); },
};

function regenerate(continuation) {
  const c = getChat();
  if (!c) return;
  saveChat(c);
  renderMessages();
  if (continuation) continuation(c);
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ "Authorization": "Bearer " + store.key }, opts.headers || {});
  if (opts.body && typeof opts.body === "string") opts.headers["Content-Type"] = "application/json";
  const r = await fetch(path, opts);
  if (r.status === 401) { showKeyForm(); throw new Error("401 Unauthorized"); }
  return r;
}

function decorateCodeblocks(bubble) {
  bubble.querySelectorAll("pre").forEach(pre => {
    if (pre.parentElement.classList.contains("codewrap")) return;
    const wrap = document.createElement("div");
    wrap.className = "codewrap";
    const lang = (pre.querySelector("code") || {}).className || "";
    const bar = document.createElement("div");
    bar.className = "codebar";
    const name = document.createElement("span");
    name.textContent = (lang.replace(/language-/, "") || "code");
    const btn = document.createElement("button");
    btn.textContent = "копировать";
    btn.setAttribute("aria-label", "Скопировать код");
    btn.onclick = () => copyText(pre.textContent, "Код скопирован");
    bar.append(name, btn);
    pre.replaceWith(wrap);
    wrap.append(bar, pre);
  });
}

function renderTray() {
  const tray = $("tray");
  tray.innerHTML = "";
  if (!activeAttachments.length) {
    tray.style.display = "none";
    return;
  }
  tray.style.display = "flex";
  for (let i = 0; i < activeAttachments.length; i++) {
    const att = activeAttachments[i];
    const card = document.createElement("div");
    card.className = "att-card";
    if (att.kind === "image" && att.previewUrl) {
      const img = document.createElement("img");
      img.src = att.previewUrl;
      img.alt = "Превью " + att.name;
      card.append(img);
    }
    const info = document.createElement("span");
    info.className = "info";
    info.textContent = att.name + " (" + (att.size > 0 ? Math.round(att.size / 1024) + " KB" : att.kind) + ")";
    const removeBtn = document.createElement("button");
    removeBtn.className = "remove";
    removeBtn.textContent = "✕";
    removeBtn.setAttribute("aria-label", "Удалить " + att.name);
    removeBtn.onclick = () => {

function addFiles(files) {
  for (const f of files) {
    const isVid = f.type.startsWith("video/");
    const kind = isVid ? "video" : "image";
    const previewUrl = kind === "image" ? URL.createObjectURL(f) : "";
    activeAttachments.push({
      id: Math.random().toString(36).slice(2),
      file: f,
      kind,
      name: f.name,
      size: f.size,
      previewUrl,
    });
  }
  renderTray();
  announce("Прикреплено файлов: " + files.length);
}

$("attachbtn").onclick = () => { $("fileinput").click(); };
$("fileinput").onchange = e => {

};

const chatarea = $("chatarea");
chatarea.ondragover = e => { e.preventDefault(); $("dropzone").classList.add("active"); };

window.addEventListener("paste", e => {
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  const files = [];
  for (const it of items) {
    if (it.kind === "file") {
      const f = it.getAsFile();
      if (f) files.push(f);

  }
  if (files.length) addFiles(files);
});

async function loadModels() {
  try {
    const r = await api("/v1/models");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const m = j.data && j.data[0];
    if (m) {
      hideKeyForm();
      lastModelInfo = m;
      renderCurInfo();
      // Дефолты сэмплинга с сервера (.env) — заполняем поля, если пользователь
      // не менял режим вручную в этой сессии.
      if (m.sampling_defaults && !sessionStorage.getItem("q36_params_dirty")) {
        const d = m.sampling_defaults;

      if (m.sampling_presets) {

function getChat() { return store.chats.find(c => c.id === store.current) || null; }
function saveChat(c) {
  const chats = store.chats;

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function renderMarkdown(src) {
  const fences = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
    fences.push('<pre><code>' + escapeHtml(code.replace(/\n$/, "")) + '</code></pre>');
    return "\u0000" + (fences.length - 1) + "\u0000";
  });
  s = escapeHtml(s);
  const rawLines = s.split("\n");
  const lines = [];
  for (let i = 0; i < rawLines.length; i++) {
    const isRow = l => l.trim().includes("|") && l.trim().length > 1;
    const isSep = l => /^\|?\s*:?-{2,}[\s:|-]*\|?\s*$/.test(l.trim());
    if (isRow(rawLines[i]) && i + 1 < rawLines.length && isSep(rawLines[i + 1])) {
      const splitRow = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = splitRow(rawLines[i]);
      let j = i + 2;
      const bodyRows = [];
      while (j < rawLines.length && isRow(rawLines[j]) && !isSep(rawLines[j])) {
        bodyRows.push(splitRow(rawLines[j]));
        j++;
      }
      let t = "<table><thead><tr>" + head.map(c => "<th>" + inlineMd(c) + "</th>").join("") + "</tr></thead><tbody>";
      for (const r of bodyRows) t += "<tr>" + r.map(c => "<td>" + inlineMd(c) + "</td>").join("") + "</tr>";
      t += "</tbody></table>";
      fences.push(t);
      lines.push("\u0000" + (fences.length - 1) + "\u0000");
      i = j - 1;
      continue;
    }
    lines.push(rawLines[i]);
  }
  let html = "", inList = null, para = [];
  const flushPara = () => { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
  const flushList = () => { if (inList) { html += "</" + inList + ">"; inList = null; } };
  for (const line of lines) {
    const fencePh = line.match(/^\u0000(\d+)\u0000$/);
    if (fencePh) { flushPara(); flushList(); html += fences[+fencePh[1]]; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushPara(); flushList(); const lv = Math.min(h[1].length, 6); html += "<h" + lv + ">" + inlineMd(h[2]) + "</h" + lv + ">"; continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { flushPara(); if (inList !== "ul") { flushList(); html += "<ul>"; inList = "ul"; } html += "<li>" + inlineMd(ul[1]) + "</li>"; continue; }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { flushPara(); if (inList !== "ol") { flushList(); html += "<ol>"; inList = "ol"; } html += "<li>" + inlineMd(ol[1]) + "</li>"; continue; }
    if (line.trim() === "") { flushPara(); flushList(); continue; }
    flushList();
    para.push(inlineMd(line));
  }
  flushPara(); flushList();
  return html;
}
function inlineMd(s) {
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function parseThinking(text, assumeThinking) {
  const close = text.search(/<\/(think|thinking)>/i);
  const open = text.search(/<(think|thinking)>/i);
  if (close >= 0 && (open < 0 || open > close)) {
    const before = text.slice(0, close);
    const after = text.slice(close).replace(/^<\/(?:think|thinking)>/i, "");
    const parts = [];
    if (before.trim()) parts.push({ kind: "think", text: before.replace(/^\n+/, "") });
    if (after.trim()) parts.push({ kind: "text", text: after.replace(/^\n+/, "") });
    if (parts.length) return parts;
  }
  if (assumeThinking && open < 0 && close < 0 && text.trim()) return [{ kind: "think", text }];
  const re = /<(think|thinking)>([\s\S]*?)(?:<\/\1>|$)/i;
  const m = text.match(re);
  if (m) {
    const before = text.slice(0, m.index);
    const after = text.slice(m.index + m[0].length).replace(/^<\/(?:think|thinking)>/i, "");
    const parts = [];
    if (before.trim()) parts.push({ kind: "text", text: before });
    parts.push({ kind: "think", text: m[2].replace(/^\n+|\n+$/g, "") });
    if (after.trim()) parts.push({ kind: "text", text: after.replace(/^\n+/, "") });
    return parts;
  }
  return [{ kind: "text", text }];
}

function renderMessages() {
  const el = $("messages");
  el.innerHTML = "";
  const c = getChat();
  if (!c) { updateCtxBar(); return; }
  c.messages.forEach((msg, i) => el.append(renderMsg(msg, false, i, c.messages)));
  updateCtxBar();
  el.scrollTop = el.scrollHeight;
}
function renderMsg(msg, streaming, idx, allMsgs) {
  const d = document.createElement("div");
  d.className = "msg " + msg.role + (streaming ? " streaming" : "");
  const role = document.createElement("div");
  role.className = "role"; role.textContent = msg.role === "user" ? "вы" : "модель";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  d.append(role, bubble);
  fillBubble(bubble, msg, streaming);
  if (msg.meta && (msg.meta.stats || msg.meta.truncated)) {
    const meta = document.createElement("div");
    meta.className = "meta";
    if (msg.meta.stats) { const s = document.createElement("span"); s.textContent = msg.meta.stats; meta.append(s); }
    if (msg.meta.truncated) { const b = document.createElement("span"); b.className = "trunc"; b.textContent = "контекст обрезан"; meta.append(b); }
    d.append(meta);
  }
  if (!streaming) {
    const acts = document.createElement("div");
    acts.className = "actions";
    const mk = (label, title, fn) => {
      const b = document.createElement("button");
      b.textContent = label; b.title = title;
      b.setAttribute("aria-label", title);
      b.onclick = fn;
      acts.append(b);
      return b;
    };
    mk("⧉", "Скопировать сообщение", () => copyText(msg.content, "Сообщение скопировано"));
    if (msg.role === "user") {
      mk("✎", "Редактировать сообщение", () => {
        const t = prompt("Редактировать сообщение:", msg.content);
        if (t === null) return;
        msg.content = t;
        saveChat(getChat());
        renderMessages();
      });
    } else {
      mk("↻", "Сгенерировать заново", () => {
        if (abortCtrl) return;
        allMsgs.splice(idx, 1);
        regenerate(c => send(true));
      });
    }
    mk("🗑", "Удалить сообщение", () => {
      allMsgs.splice(idx, 1);
      saveChat(getChat());
      renderMessages();
      toast("Сообщение удалено");
    });
    d.append(acts);
  }
  return d;
}
function fillBubble(bubble, msg, streaming) {
  bubble.innerHTML = "";
  if (msg.role === "assistant") {
    // Сервер присылает мышление отдельным полем reasoning_content (thinkText);
    // легаси-контент с </think> парсим из текста.
    if (msg.thinkText) {
      const det = document.createElement("details");
      det.className = "think";
      det.open = !!streaming;
      const sum = document.createElement("summary");
      const words = msg.thinkText.trim().split(/\s+/).filter(Boolean).length;
      sum.textContent = "Рассуждения" + (words ? " · " + words + " слов" : "");
      const tc = document.createElement("div");
      tc.className = "tc"; tc.innerHTML = renderMarkdown(msg.thinkText);
      det.append(sum, tc);
      bubble.append(det);
      if (streaming) tc.scrollTop = tc.scrollHeight;
    }
    const assumeThinking = msg.thinking === true && !msg.thinkText;
    for (const part of parseThinking(msg.content || "", assumeThinking)) {
      if (part.kind === "think") {
        const det = document.createElement("details");
        det.className = "think";
        det.open = !!streaming;
        const sum = document.createElement("summary");
        const words = part.text.trim().split(/\s+/).filter(Boolean).length;
        sum.textContent = "Рассуждения" + (words ? " · " + words + " слов" : "");
        const tc = document.createElement("div");
        tc.className = "tc"; tc.innerHTML = renderMarkdown(part.text);
        det.append(sum, tc);
        bubble.append(det);
        if (streaming) tc.scrollTop = tc.scrollHeight;
      } else {
        const span = document.createElement("div");
        span.innerHTML = renderMarkdown(part.text);
        bubble.append(span);
      }
    }
  } else {
    bubble.textContent = msg.content;
  }
  decorateCodeblocks(bubble);
}

function updateCtxBar() {
  const c = getChat();
  const chars = c ? c.messages.reduce((n, m) => n + (m.content || "").length, 0) : 0;
  const est = Math.ceil(chars / 4);
  const pct = Math.min(100, est / ctxLen * 100);
  $("ctxlabel").textContent = `контекст: ~${est} / ${ctxLen}`;
  const fill = $("ctxfill");
  fill.style.width = pct + "%";
  fill.classList.toggle("warn", pct > 90);
}

function applyPreset(name) {
  const p = SERVER_PRESETS[name] || PRESETS[name];
  if (!p) return;
  for (const k of PARAM_IDS) if (p[k] !== undefined) $("p_" + k).value = p[k];
}
function readParams() {

  o.max_tokens = Math.round(o.max_tokens);
  return o;
}

async function uploadAttachment(att) {
  const form = new FormData();
  form.append("file", att.file);
  const r = await api("/v1/media", {
    method: "POST",
    body: form,
  });
  if (!r.ok) throw new Error("Upload failed for " + att.name + ": HTTP " + r.status);
  const j = await r.json();
  return j.id;
}

async function send(regen) {
  const text = $("input").value.trim();
  if ((!text && !activeAttachments.length) || abortCtrl) return;
  if (/модель выгружена/.test($("modelinfo").textContent)) {
    toast("Модель выгружена — выберите модель и нажмите «Применить»", true);
    return;
  }
  let c = getChat();
  if (!c) { c = newChat(); store.current = c.id; }
  if (!c.messages.length) c.title = (text || activeAttachments[0].name).slice(0, 40);

  // Build client content blocks
  const contentBlocks = [];
  if (text) contentBlocks.push({ type: "text", text });

  // Upload attachments single-use
  for (const att of activeAttachments) {
    const mediaId = await uploadAttachment(att);
    if (att.kind === "image") {
      contentBlocks.push({
        type: "image_url",
        image_url: { url: "" },
        media_id: mediaId,
      });
    } else {
      contentBlocks.push({
        type: "video_url",
        video_url: { url: "" },
        media_id: mediaId,
      });
    }
  }

  // Persistent storage receives only placeholder tags (FR-030)
  let persistentText = text;
  for (const att of activeAttachments) {
    persistentText += (persistentText ? "\n" : "") + (att.kind === "image" ? "[Изображение]" : "[Видео]");
  }

  if (!regen) c.messages.push({ role: "user", content: persistentText });
  $("input").value = "";
  activeAttachments = [];
  renderTray();

  const mode = $("mode").value;
  const apiMessages = [];
  const sys = $("sysprompt").value.trim() || (c.system || "");
  c.system = sys;
  if (sys) apiMessages.push({ role: "system", content: sys });
  for (const m of c.messages) apiMessages.push({ role: m.role, content: m.content });
  if (!regen && contentBlocks.length) {
    apiMessages[apiMessages.length - 1] = { role: "user", content: contentBlocks };
  }

  let enableThink = thinkingEnabled && (mode !== "instruct");
  const body = Object.assign({
    model: modelId,
    messages: apiMessages,
    stream: true,
    stream_options: { include_usage: true },
    chat_template_kwargs: { enable_thinking: enableThink },
  }, readParams());

  const asst = { role: "assistant", content: "", thinkText: "", meta: {}, thinking: enableThink };
  c.messages.push(asst);
  saveChat(c);
  renderChatList();
  renderMessages();

  abortCtrl = new AbortController();
  $("stopbtn").disabled = false;
  $("send").disabled = true;

  let liveTok = 0, liveT0 = null;
  const liveEl = document.createElement("div");
  liveEl.className = "meta"; liveEl.style.marginTop = "4px";

  const el = $("messages");
  let msgEl = el.lastElementChild;
  msgEl.classList.add("streaming");
  userPinned = true;
  el.scrollTop = el.scrollHeight;
  const bubble = msgEl.querySelector(".bubble");
  msgEl.append(liveEl);

  let dirty = false, rafScheduled = false;
  const scheduleRedraw = () => {
    dirty = true;
    if (rafScheduled) return;
    rafScheduled = true;
    requestAnimationFrame(() => {
      rafScheduled = false;
      if (!dirty) return;
      dirty = false;
      fillBubble(bubble, asst, true);
      if (userPinned) el.scrollTop = el.scrollHeight;
    });
  };

  let firstDeltaAt = null;
  let usage = null, finishReason = null;
  const t0 = performance.now();

  try {
    const r = await api("/v1/chat/completions", {
      method: "POST",
      body: JSON.stringify(body),
      signal: abortCtrl.signal,
    });
    if (!r.ok) throw new Error("HTTP " + r.status + ": " + await r.text());

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of ev.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          let j;
          try { j = JSON.parse(data); } catch { continue; }
          const ch = j.choices && j.choices[0];
          const delta = ch && ch.delta;
          if (delta && delta.reasoning_content) {
            asst.thinkText = (asst.thinkText || "") + delta.reasoning_content;
            scheduleRedraw();
          }
          if (delta && delta.content) {
            if (!firstDeltaAt) firstDeltaAt = performance.now();
            if (!liveT0) liveT0 = performance.now();
            liveTok++;
            const ls = (performance.now() - liveT0) / 1000;
            if (ls > 0.5) {
              liveEl.textContent = "⚡ " + (liveTok / ls >= 10 ? (liveTok / ls).toFixed(0) : (liveTok / ls).toFixed(1)) + " tok/s";
            }
            asst.content += delta.content;
            scheduleRedraw();
          }
          if (ch && ch.finish_reason) finishReason = ch.finish_reason;
          if (j.usage) {
            usage = j.usage;
            if (usage.truncated === true) asst.meta.truncated = true;
          }
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError" && !String(e.message).startsWith("401")) {
      asst.content += "\n\n[ошибка: " + e.message + "]";
    }
  } finally {
    abortCtrl = null;
    $("stopbtn").disabled = true;
    $("send").disabled = false;

    const totalSecs = (performance.now() - t0) / 1000;
    const parts = [];
    if (usage) {
      const out = usage.completion_tokens ?? null;
      const inp = usage.prompt_tokens ?? null;
      if (inp != null || out != null) parts.push("in " + (inp ?? "?") + " · out " + (out ?? "?"));
      if (usage.media && usage.media.visual_tokens) {
        parts.push("visual: " + usage.media.visual_tokens + " tok");
      }
      if (out != null && firstDeltaAt) {
        const genSecs = (performance.now() - firstDeltaAt) / 1000;
        if (genSecs > 0.1) parts.push((out / genSecs >= 10
          ? (out / genSecs).toFixed(0)
          : (out / genSecs).toFixed(1)) + " tok/s");
      }
    }
    parts.push(totalSecs.toFixed(1) + "s");
    if (finishReason) parts.push(finishReason);
    asst.meta.stats = parts.join(" · ");

    saveChat(c);
    renderMessages();
  }
}

$("savedefaults").onclick = async () => {
  if (!confirm("Сохранить текущие параметры сэмплинга как дефолтные в .env сервера?")) return;
  try {
    const r = await api("/v1/sampling_defaults", {
      method: "POST",
      body: JSON.stringify(Object.assign(readParams(), {
        thinking: $("mode").value !== "instruct",
      })),
    });
    if (r.ok) {
      sessionStorage.removeItem("q36_params_dirty");
      toast("Дефолты сохранены в .env");
    } else {
      toast("Сохранение: HTTP " + r.status, true);
    }
  } catch (e) {
    if (!String(e.message).startsWith("401")) toast("Сохранение не удалось: " + e.message, true);
  }
};
$("savepreset").onclick = async () => {
  const mode = $("mode").value;
  if (!confirm(`Сохранить текущие параметры как пресет «${mode}» в .env сервера?`)) return;
  const v = readParams();

    const r = await api("/v1/sampling_preset", {

});
$("input").addEventListener("input", () => {
  const est = Math.ceil($("input").value.length / 4);
  $("tokcount").textContent = est ? "~" + est + " tok" : "";
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && abortCtrl) abortCtrl.abort();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    const q = prompt("Поиск по чатам:");
    if (!q) return;
    const hits = store.chats.filter(c => c.messages.some(m => (m.content || "").toLowerCase().includes(q.toLowerCase())));

    store.current = hits[0].id;
    renderChatList(); renderMessages();

});

  }

};

/* current model card */
function renderCurInfo() {
  const el = $("curinfo");
  const m = lastModelInfo;
  if (!m) { el.textContent = "—"; return; }
  el.innerHTML = "";
  const t = document.createElement("div");

  t.style.fontWeight = "600";

let lastModelInfo = null;

/* HF search/files/probe/download */
async function hfSearch() {
  const q = $("hfq").value.trim();
  if (q.length < 2) return;
  const box = $("hfresults");
  box.innerHTML = "<div class='badge-info'>поиск…</div>";
  try {
    const r = await api("/v1/hf/search?q=" + encodeURIComponent(q));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    box.innerHTML = "";
    if (!j.results.length) { box.innerHTML = "<div class='badge-info'>ничего не найдено</div>"; return; }
    for (const m of j.results) {
      const card = document.createElement("div");
      card.className = "hfrepo";
      const head = document.createElement("div");
      head.className = "rhead";
      const name = document.createElement("span");
      name.className = "rname"; name.textContent = m.repo; name.title = m.repo;
      const meta = document.createElement("span");
      meta.className = "rmeta"; meta.textContent = "⤓ " + m.downloads + " · ★ " + m.likes;
      const toggle = document.createElement("span");
      toggle.textContent = "▸";
      head.append(toggle, name, meta);
      const filesEl = document.createElement("div");
      filesEl.className = "rfiles";
      head.onclick = () => {
        card.classList.toggle("open");
        toggle.textContent = card.classList.contains("open") ? "▾" : "▸";
        if (card.classList.contains("open") && !filesEl.dataset.loaded) {
          filesEl.dataset.loaded = "1";
          hfFiles(m.repo, filesEl);
        }
      };
      card.append(head, filesEl);
      box.append(card);
    }
  } catch (e) {
    box.innerHTML = "<div class='badge-nofit'>ошибка: " + escapeHtml(e.message) + "</div>";
  }
}

async function hfFiles(repo, filesEl) {
  filesEl.innerHTML = "<div class='badge-info' style='padding:8px 12px'>файлы…</div>";
  try {
    const r = await api("/v1/hf/files?repo=" + encodeURIComponent(repo));
    const j = await r.json();
    filesEl.innerHTML = "";
    for (const f of j.files) {
      const row = document.createElement("div");
      row.className = "hffile";
      const name = document.createElement("span");
      name.className = "fname"; name.textContent = f.file; name.title = f.file;
      const size = document.createElement("span");
      size.className = "fsize"; size.textContent = f.size_bytes ? Math.round(f.size_bytes / 1048576) + " MiB" : "?";
      const probeBtn = document.createElement("button");
      probeBtn.textContent = "Проверить";
      const badge = document.createElement("span");
      const dlBtn = document.createElement("button");
      dlBtn.textContent = "Скачать"; dlBtn.className = "primary";
      probeBtn.onclick = () => hfProbe(repo, f.file, badge, probeBtn);
      dlBtn.onclick = () => hfDownload(repo, f.file, dlBtn);
      row.append(name, size, badge, probeBtn, dlBtn);
      filesEl.append(row);
    }
    if (!j.files.length) filesEl.innerHTML = "<div class='badge-info' style='padding:8px 12px'>нет .gguf файлов</div>";
  } catch (e) {
    filesEl.innerHTML = "<div class='badge-nofit' style='padding:8px 12px'>ошибка: " + escapeHtml(e.message) + "</div>";
  }
}

async function hfProbe(repo, file, badge, btn) {
  btn.disabled = true; badge.textContent = "…"; badge.className = "badge-info";
  try {
    const r = await api("/v1/hf/probe?repo=" + encodeURIComponent(repo) + "&file=" + encodeURIComponent(file));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error && j.error.message || "HTTP " + r.status);
    if (j.fits === true) {
      badge.textContent = "✓ влезет · " + j.arch + " · ctx " + j.native_ctx;
      badge.className = "badge-fit";
      badge.title = "Рекомендуется ctx " + j.recommended.ctx + ", slots " + j.recommended.slots;
    } else if (j.fits === false) {
      badge.textContent = "✗ не влезет (" + j.size_mib + " MiB > VRAM)";
      badge.className = "badge-nofit";
    } else {
      badge.textContent = j.arch + " · " + j.size_mib + " MiB";
      badge.className = "badge-info";
    }
  } catch (e) {
    badge.textContent = "probe: " + e.message;
    badge.className = "badge-nofit";
  }
  btn.disabled = false;
}

let hfPollTimer = null;
async function hfDownload(repo, file, btn) {
  btn.disabled = true;
  try {
    const r = await api("/v1/hf/download", { method: "POST", body: JSON.stringify({ repo, file }) });
    if (r.status === 409) { toast("Уже скачивается", true); btn.disabled = false; return; }
    if (!r.ok && r.status !== 202) throw new Error("HTTP " + r.status);
    toast("Загрузка началась: " + file);
    startDlPoll();
  } catch (e) {
    toast("Загрузка не началась: " + e.message, true);
    btn.disabled = false;
  }
}

function startDlPoll() {
  if (hfPollTimer) return;
  hfPollTimer = setInterval(pollDownloads, 2000);
  pollDownloads();
}

async function pollDownloads() {
  try {
    const r = await api("/v1/hf/downloads");
    if (!r.ok) return;
    const j = await r.json();
    const box = $("hfdownloads");
    box.innerHTML = "";
    let anyActive = false;
    for (const d of j.downloads) {
      const wrap = document.createElement("div");
      wrap.className = "dlbar";
      const name = document.createElement("div");
      name.className = "dlname"; name.textContent = d.key;
      const track = document.createElement("div");
      track.className = "dltrack";
      const fill = document.createElement("div");
      fill.className = "dlfill";
      const stat = document.createElement("div");
      stat.className = "dlstat";
      if (d.status === "downloading") {
        anyActive = true;
        const pct = d.total_bytes ? Math.round(100 * d.done_bytes / d.total_bytes) : 0;
        fill.style.width = pct + "%";
        stat.textContent = Math.round(d.done_bytes / 1048576) + " / " + (d.total_bytes ? Math.round(d.total_bytes / 1048576) : "?") + " MiB · " + pct + "%";
      } else if (d.status === "done") {
        fill.style.width = "100%";
        stat.textContent = "готово — в локальных моделях";
        stat.style.color = "var(--green)";
        loadAvailableModels();
      } else {
        stat.textContent = d.status;
        stat.style.color = "var(--red)";
      }
      track.append(fill);
      wrap.append(name, track, stat);
      box.append(wrap);
    }
    if (!anyActive) { clearInterval(hfPollTimer); hfPollTimer = null; }
  } catch (e) {}
}

$("hfsearchbtn").onclick = hfSearch;
$("hfq").addEventListener("keydown", e => { if (e.key === "Enter") hfSearch(); });

let modelSwitching = false;
let ctxMatrix = null;
const CTX_RUNGS = [2048, 4096, 6144, 8192, 12288, 16384, 24576, 32768, 49152, 65536, 81920, 98304, 131072, 196608, 262144];

async function loadCtxMatrix() {
  ctxMatrix = null;
  const path = $("modelsel").value;
  if (!path) return;
  try {
    const r = await api("/v1/ctx_matrix?path=" + encodeURIComponent(path));
    if (r.ok) ctxMatrix = await r.json();
  } catch (e) {}
  rebuildCtxOptions();
}

function rebuildCtxOptions() {
  const slots = parseInt($("slotssel").value, 10) || 4;
  const sel = $("ctxsel");
  sel.innerHTML = "";
  const cur = parseInt(sel.dataset.current || "0", 10);
  const native = (ctxMatrix && ctxMatrix.native_ctx) || 262144;
  const budget = (ctxMatrix && ctxMatrix.kv_budget_mib) || 0;
  const perTok = (ctxMatrix && ctxMatrix.kv_per_tok_mib) || 0;
  for (const c of CTX_RUNGS) {
    if (c > native) break;
    const o = document.createElement("option");
    o.value = c;
    let label = (c / 1024) + "K контекст";
    if (budget > 0 && perTok > 0) {
      const full = Math.min(slots, Math.floor(budget / (perTok * c)));
      label += full >= slots ? " · все слоты" : full > 0 ? " · ~" + full + " полных" : " · очередь";
    }
    o.textContent = label;
    if (c === cur || (!cur && c === 8192)) o.selected = true;
    sel.append(o);
  }
}

$("slotssel").onchange = rebuildCtxOptions;
$("modelsel").onchange = loadCtxMatrix;

async function loadAvailableModels() {
  try {
    const r = await api("/v1/available_models");
    if (!r.ok) return;
    const j = await r.json();
    const sel = $("modelsel");
    sel.innerHTML = "";
    for (const m of j.models || []) {
      const o = document.createElement("option");
      o.value = m.path;
      const flag = m.supported === false ? " ⚠ unsupported" : "";
      o.textContent = m.name + " (" + m.size_mib + " MiB)" + flag;
      if (m.supported === false) o.disabled = true;
      if (j.current && j.current.path && m.path === j.current.path) o.selected = true;
      sel.append(o);
    }
    if (j.current && j.current.path && ![...sel.options].some(o => o.value === j.current.path)) {
      const o = document.createElement("option");
      o.value = j.current.path;
      o.textContent = j.current.path.split(/[\\/]/).pop() + " (текущая)";
      o.selected = true;
      sel.append(o);
    }
    const slotssel = $("slotssel");
    if (!slotssel.options.length) {
      for (const s of [4, 3, 2, 1]) {
        const o = document.createElement("option");
        o.value = s;
        o.textContent = s + " слота";
        slotssel.append(o);
      }
    }
    if (j.current) {
      if (j.current.ctx) $("ctxsel").dataset.current = j.current.ctx;
      if (j.current.slots) slotssel.value = j.current.slots;
    }
    loadCtxMatrix();
    if (j.loading) watchModelSwitch();
  } catch (e) {}
}

async function watchModelSwitch() {
  if (modelSwitching) return;
  modelSwitching = true;
  $("applymodel").disabled = true;
  $("send").disabled = true;
  const t0 = Date.now();
  for (;;) {
    $("modelinfo").textContent = "переключение модели… " + Math.round((Date.now() - t0) / 1000) + "s";
    await new Promise(r => setTimeout(r, 2000));
    try {
      const r = await api("/v1/available_models");
      if (!r.ok) continue;
      const j = await r.json();
      if (j.load_error) {
        modelSwitching = false;
        $("applymodel").disabled = false;
        $("send").disabled = false;
        $("modelinfo").textContent = "ошибка загрузки модели";
        toast("Модель не загрузилась: " + String(j.load_error).split("\n")[0].slice(0, 200), true);
        break;
      }
      // loading=false только когда install завершён; ready=true — веса в
      // dispatch-потоке готовы (для batched). CandleEngine всегда ready.
      if (!j.loading && j.ready) {
        modelSwitching = false;
        $("applymodel").disabled = false;
        $("send").disabled = false;
        loadModels();
        loadAvailableModels();
        break;
      }
    } catch (e) {}
  }
}

$("applymodel").onclick = async () => {
  const path = $("modelsel").value;
  const ctx = parseInt($("ctxsel").value, 10);
  const slots = parseInt($("slotssel").value, 10);
  if (!path || !Number.isFinite(ctx)) return;
  $("ctxsel").dataset.current = ctx;
  const r = await api("/v1/switch_model", {
    method: "POST",
    body: JSON.stringify({ path, ctx, slots }),
  });
  if (r.ok) {
    watchModelSwitch();
    watchLoadGate();
  }
  else $("modelinfo").textContent = "switch: HTTP " + r.status;
};

$("unloadbtn").onclick = async () => {
  if (!confirm("Выгрузить модель и освободить VRAM? Для работы снова выберите модель и нажмите «Применить».")) return;
  try {
    const r = await api("/v1/unload_model", { method: "POST" });
    if (r.ok) {
      toast("Модель выгружена, VRAM свободна");
      $("modelinfo").textContent = "модель выгружена";
      $("send").disabled = true;
      loadAvailableModels();
    } else if (r.status === 409) {
      toast("Идёт переключение модели — подождите", true);
    } else {
      toast("Выгрузка: HTTP " + r.status, true);
    }
  } catch (e) {
    if (!String(e.message).startsWith("401")) toast("Выгрузка: " + e.message, true);
  }
};

/* разблокировать send, когда модель загружена (switch завершён) */
function watchLoadGate() {
  const t = setInterval(async () => {
    try {
      const r = await api("/v1/available_models");
      if (!r.ok) return;
      const j = await r.json();
      if (j.current && !j.loading) {
        $("send").disabled = false;
        $("modelinfo").textContent = j.current.path.split(/[\\/]/).pop();
        clearInterval(t);
      }
    } catch {}
  }, 3000);
  setTimeout(() => clearInterval(t), 600000); // макс 10 мин
}

$("mode").value = store.mode;
applyPreset($("mode").value);
if (!store.chats.length) { const c = newChat(); store.chats = [c]; store.current = c.id; }
else if (!getChat()) store.current = store.chats[0].id;

/* export chat as markdown */
function exportChat() {
  const c = getChat();
  if (!c || !c.messages.length) { toast("Чат пуст", true); return; }
  let md = "# " + c.title + "\n\n";
  if (c.system) md += "> **System:** " + c.system + "\n\n";
  for (const m of c.messages) {
    md += "## " + (m.role === "user" ? "Пользователь" : "Модель") + "\n\n" + m.content + "\n\n";
    if (m.meta && m.meta.stats) md += "*" + m.meta.stats + "*\n\n";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
  a.download = (c.title || "chat").replace(/[^а-яa-z0-9]+/gi, "_") + ".md";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Экспортировано в Markdown");
}

/* model filter */
function filterModels() {
  const q = $("modelfilter").value.trim().toLowerCase();
  for (const o of $("modelsel").options) {
    o.hidden = q && !(o.value.toLowerCase().includes(q) || o.textContent.toLowerCase().includes(q));
  }
}
$("modelfilter").addEventListener("input", filterModels);

/* export button injected into sidebar */
{
  const head = document.querySelector("aside .head");
  const exp = document.createElement("button");
  exp.textContent = "⤓"; exp.title = "Экспорт чата в Markdown";
  exp.setAttribute("aria-label", "Экспорт чата");
  exp.onclick = exportChat;
  head.append(exp);
}
